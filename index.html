<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow</title>
<meta name="description" content="Личный менеджер задач: сегодня/завтра, приоритеты, повторы, планирование дня и синхронизация с Google Calendar.">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <nav class="nav" id="nav-desktop" aria-label="Разделы"></nav>

    <div class="sidebar-foot">
      <button class="btn btn-primary btn-block" id="btn-moments-side">
        <span class="ico" aria-hidden="true">◎</span> Moments
      </button>
      <div class="sync-line" id="sync-line-side"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Сегодня</h1>
        <p id="view-subtitle" class="muted"></p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-moments" title="Планирование дня (Moments)" aria-label="Планирование дня">◎</button>
        <button class="icon-btn" id="btn-sort" title="Порядок задач" aria-label="Порядок задач" aria-pressed="false">⇅</button>
        <button class="icon-btn" id="btn-cloud" title="Синхронизация между устройствами" aria-label="Синхронизация между устройствами">☁</button>
        <button class="icon-btn" id="btn-sync" title="Синхронизировать с Google Calendar" aria-label="Синхронизировать">⟳</button>
        <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <div id="banner-root"></div>

    <section class="content" id="content"></section>
  </main>

  <nav class="tabbar" id="nav-mobile" aria-label="Разделы"></nav>

  <button class="fab" id="btn-fab" aria-label="Новая задача">+</button>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
