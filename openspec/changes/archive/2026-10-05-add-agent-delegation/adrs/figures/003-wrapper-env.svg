<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t3 d3">
<title id="t3">Откуда launchd берёт окружение claude-paiw</title><desc id="d3">launchd запускает wrapper из репозитория. Wrapper читает env-файл 0600 вне репозитория и вызывает claude с явными флагами allowlist и лимитов.</desc>
<style>text{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2933}.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#52606d}.b{fill:#f5f7fa;stroke:#9aa5b1;stroke-width:1.2}.ok{fill:#e3f6e8;stroke:#2f8f4e;stroke-width:1.4}.bad{fill:#fde8e8;stroke:#c0392b;stroke-width:1.4}.ln{stroke:#52606d;stroke-width:1.4;fill:none}.rd{stroke:#c0392b;stroke-width:1.6;fill:none}.gr{stroke:#2f8f4e;stroke-width:1.6;fill:none}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606d"/></marker></defs>
<rect class="b" x="20" y="40" width="190" height="70" rx="6"/><text class="t" x="32" y="64">launchd</text><text class="s" x="32" y="84">plist из шаблона</text><text class="s" x="32" y="100">StartInterval 1800</text>
<rect class="b" x="285" y="40" width="200" height="70" rx="6"/><text class="t" x="297" y="64">agent/run-delegation.sh</text><text class="s" x="297" y="84">в репозитории: lock,</text><text class="s" x="297" y="100">предпроверка очереди</text>
<rect class="ok" x="285" y="170" width="200" height="86" rx="6"/><text class="t" x="297" y="194">env-файл, 0600</text><text class="s" x="297" y="214">~/.config/taskflow-agent/env</text><text class="s" x="297" y="232">токен, прокси, ANTHROPIC_*,</text><text class="s" x="297" y="248">DISABLED_ITEMS; вне репозитория</text>
<rect class="b" x="550" y="40" width="190" height="86" rx="6"/><text class="t" x="562" y="64">claude --agent</text><text class="s" x="562" y="84">ai-space-assistant -p</text><text class="s" x="562" y="100">allowedTools, disallowedTools,</text><text class="s" x="562" y="116">max-turns, budget</text>
<path class="ln" marker-end="url(#a)" d="M210 75 L283 75"/><path class="ln" marker-end="url(#a)" d="M385 112 L385 168"/><text class="s" x="395" y="146">читает, экспортирует</text><path class="ln" marker-end="url(#a)" d="M485 75 L548 75"/>
<rect class="b" x="20" y="170" width="190" height="86" rx="6"/><text class="t" x="32" y="194">setup-env.sh</text><text class="s" x="32" y="214">разово собирает env-файл</text><text class="s" x="32" y="232">из окружения claude-paiw</text><path class="ln" marker-end="url(#a)" d="M210 213 L283 213"/>
<text class="s" x="20" y="300">Если spike U1 покажет расхождение с запуском claude-paiw вручную: откат на zsh -ic claude-paiw (вариант B).</text>
</svg>
