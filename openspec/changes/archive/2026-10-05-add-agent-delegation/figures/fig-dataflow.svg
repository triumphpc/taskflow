<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="t d">
<title id="t">Путь одной задачи: от галки до результата на телефоне</title><desc id="d">Пользователь ставит галку, запись синхронизируется на VPS. Демон на Mac берёт её при ближайшем прогоне, агент отдаёт JSON, демон записывает результат условной командой, телефон получает его следующим sync.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Поток данных, слева направо</text><rect x="20" y="50" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">1. Галка</text><text x="30" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent: delegated</text><text x="30" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">at = время клиента</text><rect x="210" y="50" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="220" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">2. Sync</text><text x="220" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">слияние по блокам</text><text x="220" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">запись на VPS</text><rect x="400" y="50" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="410" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">3. Очередь</text><text x="410" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent_queue(today)</text><text x="410" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">due ≤ сегодня Mac</text><rect x="590" y="50" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="600" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">4. Захват</text><text x="600" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent_claim</text><text x="600" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">claimToken, in_progress</text><rect x="590" y="180" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="600" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">5. claude -p</text><text x="600" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">ТЗ из title+notes</text><text x="600" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">JSON в stdout</text><rect x="400" y="180" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="410" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">6. Запись</text><text x="410" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent_finish(token)</text><text x="410" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">review / needs_info</text><rect x="210" y="180" width="150" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="220" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">7. Sync</text><text x="220" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">телефон получает</text><text x="220" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent + agentNotes</text><rect x="20" y="180" width="150" height="70" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">8. Проверка</text><text x="30" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">человек читает,</text><text x="30" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">закрывает галкой</text><path d="M170 85 L210 85" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><path d="M360 85 L400 85" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><path d="M550 85 L590 85" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><path d="M665 120 L665 180" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="675" y="155" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">stdin</text><path d="M590 215 L550 215" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="570" y="207" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stdout</text><path d="M400 215 L360 215" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><path d="M210 215 L170 215" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><rect x="20" y="275" width="820" height="36" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="30" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">Пока идёт шаг 5, демон раз в 60 с читает статус без модели; закрыто, снято или токен другой: SIGTERM и ничего не записывать</text>
</svg>
