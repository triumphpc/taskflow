<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d">
<title id="t">Статусы агента и допустимые переходы</title><desc id="d">Пять статусов и пустое значение. Переходы делают пользователь, демон через claim и finish или reaper по TTL. Любой статус снимается пользователем.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Состояния блока agent.status (серый: ждёт, зелёный: результат, оранжевый: ход за пользователем)</text><rect x="20" y="170" width="120" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">нет статуса</text><text x="30" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">не делегирована</text><rect x="210" y="170" width="130" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="220" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">delegated</text><text x="220" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Делегирована</text><rect x="410" y="170" width="140" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="420" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">in_progress</text><text x="420" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">В работе у агента</text><rect x="640" y="50" width="190" height="60" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="650" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">review</text><text x="650" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">На проверке; done=false</text><rect x="640" y="170" width="190" height="60" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="650" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">needs_info</text><text x="650" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Нужно уточнение</text><rect x="640" y="290" width="190" height="60" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="650" y="309" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">failed</text><text x="650" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Агент не справился</text><path d="M140 200 L210 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="175" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">галка</text><path d="M340 200 L410 200" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="375" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">agent_claim</text><path d="M550 185 L585 185 L585 80 L640 80" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="500" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">finish</text><path d="M550 200 L640 200" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="612" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">finish</text><path d="M550 215 L585 215 L585 320 L640 320" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#mo)"/><text x="500" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">finish / TTL</text><path d="M275 170 L275 130 L75 130 L75 170" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="175" y="123" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">снять галку, done, дата в будущем</text><path d="M735 350 L735 375 L75 375 L75 230" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="405" y="368" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">из любого статуса: пользователь снимает или закрывает; повтор серии: сброс в delegated</text>
</svg>
