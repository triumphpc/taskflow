ns-serif" font-size="12" fill="#6b7280">оранжевый: Нужно уточнение, Агент не справился</text><rect x="20" y="360" width="14" height="14" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="40" y="371" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">новое</text><rect x="90" y="360" width="14" height="14" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="100" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="110" y="371" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">как есть</text><rect x="180" y="360" width="14" height="14" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.8"/><text x="190" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="200" y="371" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">проблема</text><rect x="270" y="360" width="14" height="14" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="280" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="290" y="371" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">внимание</text>
