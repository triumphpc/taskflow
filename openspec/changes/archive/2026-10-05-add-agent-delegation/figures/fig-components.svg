<title id="t">Компоненты: общий модуль состояния агента и новые узлы</title><desc id="d">js/agent.js общий для браузера, sync.mjs и mcp.mjs. На сервере появляется условная запись agentTransition, в mcp.mjs три инструмента, на Mac каталог agent/ с демоном.</desc>
