<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">Как станет: та же проекция, слияние по блокам и демон на Mac</title><desc id="d">Сервер сливает поля пользователя по updatedAt, блок agent по agent.at, заметки объединяет. Демон на Mac работает через три новых инструмента MCP, результат пишет условной командой на сервере.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Как станет. Та же проекция, новое выделено</text><rect x="20" y="50" width="200" height="60" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">PWA</text><text x="30" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">normalizeTask + agent, чекбокс</text><rect x="20" y="160" width="200" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="179" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Агент в диалоге</text><text x="30" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">9 инструментов без изменений</text><rect x="320" y="50" width="220" height="74" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="330" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">serve.mjs: POST /api/sync</text><text x="330" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">sync.mjs mergeTaskRecord:</text><text x="330" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent по agent.at, заметки union</text><rect x="320" y="160" width="220" height="60" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="330" y="179" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">mcp.mjs</text><text x="330" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">+ agent_queue / claim / finish</text><rect x="620" y="100" width="160" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="630" y="119" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">data/taskflow.json</text><text x="630" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">SCHEMA 1 без миграции</text><text x="630" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">agent как доп. поле</text><rect x="320" y="250" width="220" height="60" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="330" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">POST /api/agent/transition</text><text x="330" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">условная запись в очереди sync</text><rect x="20" y="300" width="200" height="90" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Mac: демон (launchd, 30 мин)</text><text x="30" y="335" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">предпроверка без модели,</text><text x="30" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">claim, опрос 60 с, finish</text><rect x="620" y="250" width="160" height="74" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="630" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">claude --agent</text><text x="630" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">ai-space-assistant</text><text x="630" y="301" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">только чтение</text><path d="M220 80 L320 80" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="270" y="71" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">всё состояние</text><path d="M220 190 L320 190" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="270" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">tools/call</text><path d="M430 160 L430 124" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="440" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">push</text><path d="M540 90 L620 118" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="548" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">слияние по блокам</text><path d="M430 220 L430 250" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="440" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">claim / finish</text><path d="M220 345 L300 345 L300 190 L320 195" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="308" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">MCP: очередь, claim, finish</text><path d="M220 365 L700 365 L700 324" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="460" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stdin: ТЗ → stdout: JSON</text><rect x="20" y="400" width="14" height="14" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="419" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="40" y="411" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">новое</text><rect x="90" y="400" width="14" height="14" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="100" y="419" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="110" y="411" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">как есть</text><rect x="180" y="400" width="14" height="14" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.8"/><text x="190" y="419" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="200" y="411" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">проблема</text><rect x="270" y="400" width="14" height="14" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="280" y="419" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="290" y="411" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">внимание</text>
</svg>
