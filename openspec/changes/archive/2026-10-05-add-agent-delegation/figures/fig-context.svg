<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">Контекст: кто и где работает с задачей</title><desc id="d">Телефон и ноутбук синхронизируются с VPS. На Mac демон по расписанию берёт делегированные задачи через MCP и запускает claude с окружением claude-paiw, который читает источники и отдаёт результат демону.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Новое выделено зелёным: демон и запуск агента на Mac</text><rect x="20" y="50" width="190" height="74" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Браузер, PWA</text><text x="30" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">телефон и ноутбук</text><text x="30" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">чекбокс, статус, результат</text><rect x="305" y="50" width="200" height="74" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="315" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">VPS: TaskFlow</text><text x="315" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">serve.mjs + sync.mjs + mcp.mjs</text><text x="315" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">data/taskflow.json</text><rect x="20" y="220" width="190" height="74" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="239" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Пользователь</text><text x="30" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">ставит галку делегирования,</text><text x="30" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">проверяет и закрывает сам</text><rect x="290" y="220" width="240" height="94" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="300" y="239" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Mac: launchd, каждые 30 мин</text><text x="300" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">демон agent/ (Node, без модели):</text><text x="300" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">очередь, захват, опрос, запись</text><rect x="610" y="220" width="180" height="94" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="620" y="239" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">claude --agent</text><text x="620" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">ai-space-assistant,</text><text x="620" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">окружение claude-paiw,</text><text x="620" y="287" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">allowlist: только чтение</text><rect x="590" y="50" width="190" height="120" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="600" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Источники (только чтение)</text><text x="600" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">почта, чаты, календарь,</text><text x="600" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Jira, GitLab, Confluence</text><text x="600" y="117" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">отправка и запись запрещены</text><path d="M210 87 L305 87" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="257.5" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sync, HTTPS</text><path d="M115 220 L115 124" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="125" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">делегирует, закрывает</text><path d="M405 220 L405 124" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="415" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">MCP: очередь, захват, результат</text><path d="M530 267 L610 267" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="570" y="258" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ТЗ → JSON</text><path d="M700 220 L700 170" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="710" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">читает</text><text x="20" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">Агент не пишет в TaskFlow: результат записывает демон одной условной командой.</text><rect x="20" y="372" width="14" height="14" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="391" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="40" y="383" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">новое</text><rect x="90" y="372" width="14" height="14" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="100" y="391" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="110" y="383" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">как есть</text><rect x="180" y="372" width="14" height="14" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.8"/><text x="190" y="391" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="200" y="383" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">проблема</text><rect x="270" y="372" width="14" height="14" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="280" y="391" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="290" y="383" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">внимание</text>
</svg>
