<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" role="img" aria-labelledby="t d">
<title id="t">Один прогон демона: очередь, захват, работа, запись</title><desc id="d">Демон под launchd проверяет очередь без модели, захватывает задачу, запускает claude, раз в минуту сверяет статус и записывает результат условной командой.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="80" y1="54" x2="80" y2="706" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="10" y="20" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="20" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">launchd + shell</text><line x1="250" y1="54" x2="250" y2="706" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="180" y="20" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="190" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">runner (Node)</text><line x1="410" y1="54" x2="410" y2="706" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="355" y="20" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="365" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">mcp.mjs</text><line x1="540" y1="54" x2="540" y2="706" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="485" y="20" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="495" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">sync.mjs</text><line x1="680" y1="54" x2="680" y2="706" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="625" y="20" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="635" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">claude -p</text><path d="M80 82 L249 82" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="165" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">каждые 1800 с; env 0600</text><path d="M250 114 L288 114 L288 132 L252 132" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="294" y="127" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">lock mkdir + pid</text><path d="M250 154 L409 154" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="330" y="149" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">agent_queue(today)</text><path d="M410 186 L539 186" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="475" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">snapshot</text><path d="M410 218 L251 218" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mg)"/><text x="330" y="213" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">queue[], stale[]</text><path d="M250 250 L409 250" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#mo)"/><text x="330" y="245" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">stale: agent_finish(by_ttl)</text><g><rect x="190" y="268" width="300" height="28" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="200" y="287" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">очередь пуста: выход без вызова модели</text></g><path d="M250 324 L409 324" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="330" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">agent_claim(id, today)</text><path d="M410 356 L539 356" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="475" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">claim: только из delegated</text><path d="M410 388 L251 388" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mg)"/><text x="330" y="383" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">claimToken</text><path d="M250 420 L679 420" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="465" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">spawn, группа процессов; ТЗ в stdin</text><path d="M250 452 L409 452" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="330" y="447" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">каждые 60 с: agent_queue(task)</text><path d="M680 484 L251 484" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mg)"/><text x="465" y="479" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">stdout: JSON {status, text}</text><path d="M250 516 L288 516 L288 534 L252 534" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="294" y="529" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">parse, обрезка до лимита</text><path d="M250 556 L409 556" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="330" y="551" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">agent_finish(id, token, status, text)</text><path d="M410 588 L539 588" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="475" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">finish: in_progress + токен совпал</text><path d="M540 620 L578 620 L578 638 L542 638" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="584" y="633" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">agent + заметка, одна запись файла</text><path d="M250 660 L288 660 L288 678 L252 678" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="294" y="673" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">следующая задача, до 3 за прогон</text>
</svg>
