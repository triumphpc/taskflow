<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" role="img" aria-labelledby="t d">
<title id="t">Закрыли задачу во время работы: агент молчит, запись отклонена</title><desc id="d">Пользователь закрывает задачу, пока claude работает. Опрос через минуту видит изменение и убивает процесс. Если закрыли уже после завершения claude, условная запись отклоняется на сервере.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="80" y1="54" x2="80" y2="402" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="15" y="20" width="130" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="25" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">Клиент (PWA)</text><line x1="260" y1="54" x2="260" y2="402" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="205" y="20" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="215" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">sync.mjs</text><line x1="440" y1="54" x2="440" y2="402" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="390" y="20" width="100" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="400" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">runner</text><line x1="620" y1="54" x2="620" y2="402" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="565" y="20" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="575" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">claude -p</text><path d="M80 82 L259 82" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="170" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">sync: done=true, agent {status:null, at}</text><path d="M440 114 L261 114" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="350" y="109" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">опрос 60 с: agent_queue(task)</text><path d="M260 146 L439 146" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mg)"/><text x="350" y="141" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">done, нет токена</text><path d="M440 178 L619 178" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mr)"/><text x="530" y="173" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">SIGTERM группе, через 10 с SIGKILL</text><path d="M440 210 L478 210 L478 228 L442 228" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#mg)"/><text x="484" y="223" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">ничего не пишем, лог</text><g><rect x="100" y="236" width="440" height="28" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="110" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">Окно гонки: claude закончил, а закрытие пришло до finish</text></g><path d="M440 292 L261 292" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="350" y="287" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">agent_finish(id, token, review, text)</text><path d="M260 324 L298 324 L298 342 L262 342" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mr)"/><text x="304" y="337" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">статус не in_progress: отказ</text><path d="M260 364 L439 364" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mr)"/><text x="350" y="359" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle">AGENT_REJECTED:closed, записи нет</text>
</svg>
