<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">Как есть: запись задачи уходит целиком, побеждает больший updatedAt</title><desc id="d">Клиент и MCP шлют записи на /api/sync. Сервер заменяет запись целиком, если updatedAt новее. Девять инструментов MCP читают и пишут через тот же путь. Автоматического исполнителя задач нет.</desc>
<defs><marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Как есть. Проекция: путь записи задачи</text><rect x="20" y="50" width="200" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">PWA</text><text x="30" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">normalizeTask по белому списку</text><rect x="20" y="160" width="200" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="30" y="179" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Агент в диалоге</text><text x="30" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">9 инструментов MCP</text><rect x="320" y="50" width="220" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="330" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">serve.mjs: POST /api/sync</text><text x="330" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">sync.mjs #merge</text><rect x="320" y="160" width="220" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="330" y="179" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">mcp.mjs</text><text x="330" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">normalizeTask (копия)</text><rect x="620" y="100" width="160" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="630" y="119" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">data/taskflow.json</text><text x="630" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">SCHEMA 1</text><text x="630" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">запись целиком</text><rect x="320" y="270" width="460" height="60" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.8"/><text x="330" y="289" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Проблема для делегирования</text><text x="330" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">старый клиент или устаревшая копия затрёт любое новое поле агента</text><text x="330" y="321" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280"></text><path d="M220 80 L320 80" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="270" y="71" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">всё состояние</text><path d="M220 190 L320 190" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="270" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">tools/call</text><path d="M430 160 L430 110" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#mn)"/><text x="440" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">push записи</text><path d="M540 80 L620 125" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mr)"/><text x="552" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">замена целиком</text><text x="20" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">Исполнителя «по расписанию» и поля статуса нет.</text><rect x="20" y="340" width="14" height="14" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.8"/><text x="30" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="40" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">новое</text><rect x="90" y="340" width="14" height="14" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="100" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="110" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">как есть</text><rect x="180" y="340" width="14" height="14" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.8"/><text x="190" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="200" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">проблема</text><rect x="270" y="340" width="14" height="14" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.8"/><text x="280" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="bold"></text><text x="290" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937">внимание</text>
</svg>
