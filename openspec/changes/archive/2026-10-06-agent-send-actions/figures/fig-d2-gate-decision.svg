<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 642" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Решение pre-хука: пять проверок, любой отказ закрывает вызов</text><rect x="180" y="50" width="300" height="44" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="330" y="76" text-anchor="middle" font-size="12" fill="#1f2937">PreToolUse: stdin JSON разобран</text><line x1="330" y1="94" x2="330" y2="126" stroke="#16a34a" marker-end="url(#mg)"/><rect x="180" y="126" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="152" text-anchor="middle" font-size="12" fill="#1f2937">1. Политика прочитана, права и формат верны?</text><line x1="330" y1="170" x2="330" y2="202" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="190" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="480" y1="148" x2="560" y2="148" stroke="#dc2626" marker-end="url(#mr)"/><text x="520" y="140" text-anchor="middle" font-size="11" fill="#dc2626">нет</text><rect x="560" y="126" width="330" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="725" y="144.5" text-anchor="middle" font-size="12" fill="#1f2937">deny + audit blocked(policy)</text><text x="725" y="159.5" text-anchor="middle" font-size="12" fill="#1f2937">политика не прочитана</text><rect x="180" y="202" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="228" text-anchor="middle" font-size="12" fill="#1f2937">2. Адресат и текст найдены в tool_input?</text><line x1="330" y1="246" x2="330" y2="278" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="266" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="480" y1="224" x2="560" y2="224" stroke="#dc2626" marker-end="url(#mr)"/><text x="520" y="216" text-anchor="middle" font-size="11" fill="#dc2626">нет</text><rect x="560" y="202" width="330" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="725" y="220.5" text-anchor="middle" font-size="12" fill="#1f2937">deny + audit blocked(target_missing)</text><text x="725" y="235.5" text-anchor="middle" font-size="12" fill="#1f2937">адресат не определён</text><rect x="180" y="278" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="304" text-anchor="middle" font-size="12" fill="#1f2937">3. Адресат есть в белом списке своего типа?</text><line x1="330" y1="322" x2="330" y2="354" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="342" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="480" y1="300" x2="560" y2="300" stroke="#dc2626" marker-end="url(#mr)"/><text x="520" y="292" text-anchor="middle" font-size="11" fill="#dc2626">нет</text><rect x="560" y="278" width="330" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="725" y="296.5" text-anchor="middle" font-size="12" fill="#1f2937">deny + audit blocked(not_allowed)</text><text x="725" y="311.5" text-anchor="middle" font-size="12" fill="#1f2937">адресат вне списка</text><rect x="180" y="354" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="380" text-anchor="middle" font-size="12" fill="#1f2937">4. Слот потолка свободен?</text><line x1="330" y1="398" x2="330" y2="430" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="418" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="480" y1="376" x2="560" y2="376" stroke="#dc2626" marker-end="url(#mr)"/><text x="520" y="368" text-anchor="middle" font-size="11" fill="#dc2626">нет</text><rect x="560" y="354" width="330" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="725" y="372.5" text-anchor="middle" font-size="12" fill="#1f2937">deny + audit blocked(limit)</text><text x="725" y="387.5" text-anchor="middle" font-size="12" fill="#1f2937">потолок исчерпан</text><rect x="180" y="430" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="456" text-anchor="middle" font-size="12" fill="#1f2937">5. Запись attempt дописана в audit?</text><line x1="330" y1="474" x2="330" y2="506" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="494" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="480" y1="452" x2="560" y2="452" stroke="#dc2626" marker-end="url(#mr)"/><text x="520" y="444" text-anchor="middle" font-size="11" fill="#dc2626">нет</text><rect x="560" y="430" width="330" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="725" y="448.5" text-anchor="middle" font-size="12" fill="#1f2937">deny + audit blocked(gate_error)</text><text x="725" y="463.5" text-anchor="middle" font-size="12" fill="#1f2937">сбой записи</text><rect x="180" y="506" width="300" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="330" y="532" text-anchor="middle" font-size="12" fill="#1f2937">allow: permissionDecision = allow</text><rect x="560" y="496" width="330" height="58" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="725" y="514" text-anchor="middle" font-size="12" fill="#1f2937">Любое исключение или падение node:</text><text x="725" y="529" text-anchor="middle" font-size="12" fill="#1f2937">exit 2 (команда хука: node … || exit 2)</text><text x="725" y="544" text-anchor="middle" font-size="12" fill="#1f2937">вызов блокируется</text><text x="180" y="588" text-anchor="start" font-size="11" fill="#6b7280">Причина в ответе короткая; списки адресатов в неё не попадают.</text><rect x="20" y="612" width="14" height="14" rx="2" fill="#e3f2e7" stroke="#16a34a"/><text x="40" y="623" text-anchor="start" font-size="11" fill="#6b7280">проверка gate</text><rect x="190" y="612" width="14" height="14" rx="2" fill="#fbe9e7" stroke="#dc2626"/><text x="210" y="623" text-anchor="start" font-size="11" fill="#6b7280">отказ</text><rect x="360" y="612" width="14" height="14" rx="2" fill="#fdf0dd" stroke="#d97706"/><text x="380" y="623" text-anchor="start" font-size="11" fill="#6b7280">страховка</text>
</svg>
