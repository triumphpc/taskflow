<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 582" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Один send-вызов: pre-хук выдаёт право, post-хук фиксирует итог</text><line x1="90" y1="84" x2="90" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="270" y1="84" x2="270" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="450" y1="84" x2="450" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="630" y1="84" x2="630" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="810" y1="84" x2="810" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="980" y1="84" x2="980" y2="574" stroke="#9ca3af" stroke-dasharray="3 4"/><rect x="28" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="90" y="60.5" text-anchor="middle" font-size="12" fill="#1f2937">Агент или</text><text x="90" y="75.5" text-anchor="middle" font-size="12" fill="#1f2937">субагент</text><rect x="208" y="44" width="124" height="40" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="270" y="60.5" text-anchor="middle" font-size="12" fill="#1f2937">send-gate.mjs</text><text x="270" y="75.5" text-anchor="middle" font-size="12" fill="#1f2937">pre</text><rect x="388" y="44" width="124" height="40" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="450" y="68" text-anchor="middle" font-size="12" fill="#1f2937">send-policy.json</text><rect x="568" y="44" width="124" height="40" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="630" y="68" text-anchor="middle" font-size="12" fill="#1f2937">runs/&lt;id&gt;/</text><rect x="748" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="810" y="68" text-anchor="middle" font-size="12" fill="#1f2937">MCP-сервер</text><rect x="918" y="44" width="124" height="40" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="980" y="60.5" text-anchor="middle" font-size="12" fill="#1f2937">send-gate.mjs</text><text x="980" y="75.5" text-anchor="middle" font-size="12" fill="#1f2937">post, fail</text><line x1="92" y1="112" x2="268" y2="112" stroke="#16a34a" marker-end="url(#mg)"/><text x="180" y="106" text-anchor="middle" font-size="11" fill="#16a34a">PreToolUse (stdin)</text>
<line x1="272" y1="144" x2="448" y2="144" stroke="#16a34a" marker-end="url(#mg)"/><text x="360" y="138" text-anchor="middle" font-size="11" fill="#16a34a">1 читает, проверяет</text>
<line x1="448" y1="176" x2="272" y2="176" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#mg)"/><text x="360" y="170" text-anchor="middle" font-size="11" fill="#16a34a">allow, limits</text>
<path d="M272,200 H316 V216 H274" fill="none" stroke="#16a34a" marker-end="url(#mg)"/><text x="322" y="211" text-anchor="start" font-size="11" fill="#16a34a">2 адресат, 3 в списке</text>
<line x1="272" y1="240" x2="628" y2="240" stroke="#16a34a" marker-end="url(#mg)"/><text x="450" y="234" text-anchor="middle" font-size="11" fill="#16a34a">4 слот (O_EXCL)</text>
<line x1="272" y1="272" x2="628" y2="272" stroke="#16a34a" marker-end="url(#mg)"/><text x="450" y="266" text-anchor="middle" font-size="11" fill="#16a34a">5 audit: attempt</text>
<line x1="268" y1="304" x2="92" y2="304" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#mg)"/><text x="180" y="298" text-anchor="middle" font-size="11" fill="#16a34a">allow (JSON, exit 0)</text>
<line x1="92" y1="336" x2="808" y2="336" stroke="#6b7280" marker-end="url(#ma)"/><text x="450" y="330" text-anchor="middle" font-size="11" fill="#6b7280">вызов инструмента</text>
<line x1="808" y1="368" x2="92" y2="368" stroke="#6b7280" stroke-dasharray="4 3" marker-end="url(#ma)"/><text x="450" y="362" text-anchor="middle" font-size="11" fill="#6b7280">ответ или ошибка</text>
<line x1="92" y1="400" x2="978" y2="400" stroke="#16a34a" marker-end="url(#mg)"/><text x="535" y="394" text-anchor="middle" font-size="11" fill="#16a34a">PostToolUse | PostToolUseFailure</text>
<line x1="978" y1="432" x2="632" y2="432" stroke="#16a34a" marker-end="url(#mg)"/><text x="805" y="426" text-anchor="middle" font-size="11" fill="#16a34a">audit: ok + ссылка | error</text>
<rect x="210" y="456" width="560" height="42" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="490" y="473.5" text-anchor="middle" font-size="12" fill="#1f2937">Любой шаг 1-5 не прошёл или упал: deny + audit blocked(причина),</text><text x="490" y="488.5" text-anchor="middle" font-size="12" fill="#1f2937">вызов до MCP не доходит. Блок по списку и по политике слот не занимает.</text>
<rect x="460" y="508" width="520" height="42" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="720" y="525.5" text-anchor="middle" font-size="12" fill="#1f2937">Post-хук упал или не сработал: в журнале остаётся attempt без итога,</text><text x="720" y="540.5" text-anchor="middle" font-size="12" fill="#1f2937">демон покажет «начато, итог не подтверждён».</text>
</svg>
