<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Ключевой сценарий: делегирована задача «напиши в чат X: …»</text><text x="60" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#6b7280">Было</text><text x="540" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#16a34a">Станет</text><line x1="490" y1="40" x2="490" y2="540" stroke="#9ca3af" stroke-dasharray="3 4"/><rect x="60" y="70" width="330" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="225" y="97" text-anchor="middle" font-size="12" fill="#1f2937">Задача в TaskFlow, чат X указан</text><rect x="60" y="140" width="330" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="225" y="167" text-anchor="middle" font-size="12" fill="#1f2937">claude читает; send-инструменты в deny</text><rect x="60" y="210" width="330" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="225" y="237" text-anchor="middle" font-size="12" fill="#1f2937">результат: текст-черновик в agentNotes</text><rect x="60" y="280" width="330" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="225" y="307" text-anchor="middle" font-size="12" fill="#1f2937">review = «черновик готов»</text><rect x="60" y="350" width="330" height="46" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="225" y="377" text-anchor="middle" font-size="12" fill="#1f2937">пользователь копирует и отправляет сам</text><line x1="225" y1="116" x2="225" y2="140" stroke="#6b7280" marker-end="url(#ma)"/><line x1="225" y1="186" x2="225" y2="210" stroke="#6b7280" marker-end="url(#ma)"/><line x1="225" y1="256" x2="225" y2="280" stroke="#6b7280" marker-end="url(#ma)"/><line x1="225" y1="326" x2="225" y2="350" stroke="#6b7280" marker-end="url(#ma)"/><text x="60" y="430" text-anchor="start" font-size="11" fill="#6b7280">Журнала нет: что и куда ушло, знает только сам пользователь.</text><rect x="540" y="70" width="340" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="710" y="97" text-anchor="middle" font-size="12" fill="#1f2937">Задача в TaskFlow, чат X указан</text><rect x="540" y="140" width="340" height="46" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="710" y="167" text-anchor="middle" font-size="12" fill="#1f2937">claude вызывает messenger-send-message</text><rect x="540" y="210" width="340" height="46" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="710" y="237" text-anchor="middle" font-size="12" fill="#1f2937">gate: чат в списке? слот vk свободен?</text><rect x="540" y="300" width="160" height="56" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="620" y="324.5" text-anchor="middle" font-size="12" fill="#1f2937">отправка в VK Teams</text><text x="620" y="339.5" text-anchor="middle" font-size="12" fill="#1f2937">audit: attempt, ok + ссылка</text><rect x="730" y="300" width="230" height="56" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="845" y="317" text-anchor="middle" font-size="12" fill="#1f2937">deny: «адресат вне списка»</text><text x="845" y="332" text-anchor="middle" font-size="12" fill="#1f2937">audit: blocked; агент прикладывает</text><text x="845" y="347" text-anchor="middle" font-size="12" fill="#1f2937">текст, который хотел отправить</text><rect x="540" y="400" width="420" height="46" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="750" y="427" text-anchor="middle" font-size="12" fill="#1f2937">демон собирает журнал из audit.jsonl и пишет agent_finish</text><rect x="540" y="470" width="420" height="52" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="750" y="492.5" text-anchor="middle" font-size="12" fill="#1f2937">review = «выполнено, проверь»; журнал первым блоком,</text><text x="750" y="507.5" text-anchor="middle" font-size="12" fill="#1f2937">при блокировках сверху «Не всё выполнено»</text><line x1="710" y1="116" x2="710" y2="140" stroke="#6b7280" marker-end="url(#ma)"/><line x1="710" y1="186" x2="710" y2="210" stroke="#6b7280" marker-end="url(#ma)"/><line x1="620" y1="256" x2="620" y2="300" stroke="#16a34a" marker-end="url(#mg)"/><text x="628" y="282" text-anchor="start" font-size="11" fill="#16a34a">да</text><line x1="800" y1="256" x2="800" y2="300" stroke="#d97706" marker-end="url(#mo)"/><text x="808" y="282" text-anchor="start" font-size="11" fill="#d97706">нет</text><line x1="620" y1="356" x2="620" y2="400" stroke="#16a34a" marker-end="url(#mg)"/><path d="M845,356 V378 H760 V400" fill="none" stroke="#d97706" marker-end="url(#mo)"/><line x1="710" y1="446" x2="710" y2="470" stroke="#16a34a" marker-end="url(#mg)"/><rect x="540" y="548" width="14" height="14" rx="2" fill="#e3f2e7" stroke="#16a34a"/><text x="560" y="559" text-anchor="start" font-size="11" fill="#6b7280">новое</text><rect x="710" y="548" width="14" height="14" rx="2" fill="#fdf0dd" stroke="#d97706"/><text x="730" y="559" text-anchor="start" font-size="11" fill="#6b7280">блокировка (страховка)</text><rect x="880" y="548" width="14" height="14" rx="2" fill="#fbe9e7" stroke="#dc2626"/><text x="900" y="559" text-anchor="start" font-size="11" fill="#6b7280">ручной шаг</text>
</svg>
