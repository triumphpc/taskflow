<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Контекст: демон делегирования, агент и внешние системы</text><rect x="450" y="44" width="290" height="380" rx="6" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="462" y="62" text-anchor="start" font-size="11" fill="#6b7280">Mac пользователя (launchd, раз в минуту)</text><rect x="20" y="160" width="130" height="70" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="85" y="191.5" text-anchor="middle" font-size="12" fill="#1f2937">Пользователь</text><text x="85" y="206.5" text-anchor="middle" font-size="12" fill="#1f2937">TaskFlow UI / чат</text><rect x="230" y="160" width="190" height="70" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="325" y="184" text-anchor="middle" font-size="12" fill="#1f2937">TaskFlow</text><text x="325" y="199" text-anchor="middle" font-size="12" fill="#1f2937">serve.mjs + mcp.mjs</text><text x="325" y="214" text-anchor="middle" font-size="12" fill="#1f2937">задачи, agentNotes</text><rect x="480" y="80" width="230" height="50" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="595" y="101.5" text-anchor="middle" font-size="12" fill="#1f2937">Демон делегирования</text><text x="595" y="116.5" text-anchor="middle" font-size="12" fill="#1f2937">delegation-runner.mjs</text><rect x="480" y="170" width="230" height="50" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="595" y="191.5" text-anchor="middle" font-size="12" fill="#1f2937">claude --agent</text><text x="595" y="206.5" text-anchor="middle" font-size="12" fill="#1f2937">ai-space-assistant</text><rect x="480" y="260" width="230" height="56" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="595" y="284.5" text-anchor="middle" font-size="12" fill="#1f2937">send-gate (хук) + файлы</text><text x="595" y="299.5" text-anchor="middle" font-size="12" fill="#1f2937">прогона: слоты, audit</text><rect x="480" y="350" width="230" height="56" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="595" y="374.5" text-anchor="middle" font-size="12" fill="#1f2937">send-policy.json (0600)</text><text x="595" y="389.5" text-anchor="middle" font-size="12" fill="#1f2937">белые списки и потолки</text><rect x="850" y="120" width="130" height="140" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="915" y="156.5" text-anchor="middle" font-size="12" fill="#1f2937">Внешние системы</text><text x="915" y="171.5" text-anchor="middle" font-size="12" fill="#1f2937"></text><text x="915" y="186.5" text-anchor="middle" font-size="12" fill="#1f2937">VK Teams</text><text x="915" y="201.5" text-anchor="middle" font-size="12" fill="#1f2937">GitLab</text><text x="915" y="216.5" text-anchor="middle" font-size="12" fill="#1f2937">Jira</text><text x="915" y="231.5" text-anchor="middle" font-size="12" fill="#1f2937">Confluence</text><line x1="150" y1="184" x2="230" y2="184" stroke="#6b7280" marker-end="url(#ma)"/><text x="190" y="176" text-anchor="middle" font-size="11" fill="#6b7280">делегирует</text><line x1="230" y1="210" x2="150" y2="210" stroke="#16a34a" marker-end="url(#mg)"/><text x="190" y="224" text-anchor="middle" font-size="11" fill="#16a34a">проверяет</text><path d="M480,105 H325 V158" fill="none" stroke="#16a34a" marker-end="url(#mg)"/><text x="340" y="98" text-anchor="start" font-size="11" fill="#16a34a">claim, finish + журнал</text><line x1="595" y1="130" x2="595" y2="170" stroke="#6b7280" marker-end="url(#ma)"/><text x="605" y="154" text-anchor="start" font-size="11" fill="#6b7280">запуск, промпт</text><line x1="595" y1="220" x2="595" y2="260" stroke="#16a34a" marker-end="url(#mg)"/><text x="605" y="244" text-anchor="start" font-size="11" fill="#16a34a">каждый send-вызов</text><line x1="595" y1="316" x2="595" y2="350" stroke="#16a34a" marker-end="url(#mg)"/><text x="605" y="338" text-anchor="start" font-size="11" fill="#16a34a">читает каждый раз</text><line x1="710" y1="185" x2="850" y2="185" stroke="#6b7280" marker-end="url(#ma)"/><text x="790" y="177" text-anchor="middle" font-size="11" fill="#6b7280">чтение</text><line x1="710" y1="208" x2="850" y2="208" stroke="#16a34a" marker-end="url(#mg)"/><text x="790" y="224" text-anchor="middle" font-size="11" fill="#16a34a">запись (после allow)</text><rect x="20" y="440" width="14" height="14" rx="2" fill="#e3f2e7" stroke="#16a34a"/><text x="40" y="451" text-anchor="start" font-size="11" fill="#6b7280">новое в этом change</text><rect x="190" y="440" width="14" height="14" rx="2" fill="#ffffff" stroke="#9ca3af"/><text x="210" y="451" text-anchor="start" font-size="11" fill="#6b7280">есть сейчас</text>
