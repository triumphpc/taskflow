<rect x="20" y="160" width="100" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="70" y="194" text-anchor="middle" font-size="12" fill="#1f2937">Пользователь</text><rect x="190" y="160" width="140" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="260" y="186.5" text-anchor="middle" font-size="12" fill="#1f2937">TaskFlow</text><text x="260" y="201.5" text-anchor="middle" font-size="12" fill="#1f2937">agentNotes</text><rect x="380" y="160" width="140" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="450" y="186.5" text-anchor="middle" font-size="12" fill="#1f2937">Демон</text><text x="450" y="201.5" text-anchor="middle" font-size="12" fill="#1f2937">delegation-runner</text><rect x="570" y="160" width="150" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="645" y="186.5" text-anchor="middle" font-size="12" fill="#1f2937">claude</text><text x="645" y="201.5" text-anchor="middle" font-size="12" fill="#1f2937">ai-space-assistant</text><rect x="790" y="160" width="140" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="860" y="186.5" text-anchor="middle" font-size="12" fill="#1f2937">MCP: VK Teams,</text><text x="860" y="201.5" text-anchor="middle" font-size="12" fill="#1f2937">GitLab, Jira, Confl.</text><line x1="120" y1="190" x2="190" y2="190" stroke="#6b7280" marker-end="url(#ma)"/><text x="155" y="182" text-anchor="middle" font-size="11" fill="#6b7280">делегирует</text><line x1="330" y1="185" x2="380" y2="185" stroke="#6b7280" marker-end="url(#ma)"/><text x="355" y="177" text-anchor="middle" font-size="11" fill="#6b7280">claim</text><line x1="520" y1="190" x2="570" y2="190" stroke="#6b7280" marker-end="url(#ma)"/><text x="545" y="182" text-anchor="middle" font-size="11" fill="#6b7280">spawn</text><line x1="720" y1="175" x2="790" y2="175" stroke="#6b7280" marker-end="url(#ma)"/><text x="755" y="167" text-anchor="middle" font-size="11" fill="#6b7280">чтение</text><path d="M420,220 V300 H260 V222" fill="none" stroke="#6b7280" marker-end="url(#ma)"/><text x="270" y="292" text-anchor="start" font-size="11" fill="#6b7280">finish: текст-черновик</text><text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">As-Is: агент только читает, отправляет человек</text><rect x="570" y="270" width="150" height="56" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="645" y="294.5" text-anchor="middle" font-size="12" fill="#1f2937">deny: все send-</text><text x="645" y="309.5" text-anchor="middle" font-size="12" fill="#1f2937">инструменты</text><line x1="645" y1="220" x2="645" y2="270" stroke="#dc2626" marker-end="url(#mr)"/><text x="655" y="250" text-anchor="start" font-size="11" fill="#dc2626">отклонено</text><path d="M240,222 V262 H80 V292" fill="none" stroke="#dc2626" stroke-dasharray="4 3" marker-end="url(#mr)"/><text x="100" y="256" text-anchor="start" font-size="11" fill="#dc2626">читает</text><rect x="20" y="292" width="120" height="60" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="80" y="318.5" text-anchor="middle" font-size="12" fill="#1f2937">копирует текст,</text><text x="80" y="333.5" text-anchor="middle" font-size="12" fill="#1f2937">шлёт вручную</text><text x="20" y="390" text-anchor="start" font-size="11" fill="#6b7280">Красное: лишний ручной шаг, ради которого делался change.</text><rect x="20" y="410" width="14" height="14" rx="2" fill="#fbe9e7" stroke="#dc2626"/><text x="40" y="421" text-anchor="start" font-size="11" fill="#6b7280">проблема as-is</text><rect x="190" y="410" width="14" height="14" rx="2" fill="#ffffff" stroke="#9ca3af"/><text x="210" y="421" text-anchor="start" font-size="11" fill="#6b7280">как есть</text>
