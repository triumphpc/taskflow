<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">После завершения claude: журнал строится при любом исходе</text><rect x="20" y="50" width="220" height="56" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="130" y="67" text-anchor="middle" font-size="12" fill="#1f2937">exit</text><text x="130" y="82" text-anchor="middle" font-size="12" fill="#1f2937">parseClaudeOutput:</text><text x="130" y="97" text-anchor="middle" font-size="12" fill="#1f2937">review | needs_info | failed</text><line x1="130" y1="106" x2="450" y2="160" stroke="#16a34a" marker-end="url(#mg)"/><rect x="260" y="50" width="220" height="56" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="370" y="74.5" text-anchor="middle" font-size="12" fill="#1f2937">timeout</text><text x="370" y="89.5" text-anchor="middle" font-size="12" fill="#1f2937">failed «Таймаут 15 минут»</text><line x1="370" y1="106" x2="450" y2="160" stroke="#16a34a" marker-end="url(#mg)"/><rect x="500" y="50" width="220" height="56" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="610" y="74.5" text-anchor="middle" font-size="12" fill="#1f2937">spawn_error / лимит ходов, бюджета</text><text x="610" y="89.5" text-anchor="middle" font-size="12" fill="#1f2937">failed с причиной</text><line x1="610" y1="106" x2="450" y2="160" stroke="#16a34a" marker-end="url(#mg)"/><rect x="740" y="50" width="220" height="56" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="850" y="74.5" text-anchor="middle" font-size="12" fill="#1f2937">aborted (задачу закрыли)</text><text x="850" y="89.5" text-anchor="middle" font-size="12" fill="#1f2937">результат не пишется</text><rect x="740" y="160" width="220" height="44" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="850" y="178.5" text-anchor="middle" font-size="12" fill="#1f2937">в лог демона: число действий</text><text x="850" y="193.5" text-anchor="middle" font-size="12" fill="#1f2937">из audit.jsonl</text><line x1="850" y1="106" x2="850" y2="160" stroke="#d97706" marker-end="url(#mo)"/><rect x="240" y="160" width="420" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="450" y="178.5" text-anchor="middle" font-size="12" fill="#1f2937">readAudit(runDir) → buildJournal</text><text x="450" y="193.5" text-anchor="middle" font-size="12" fill="#1f2937">attempt + ok/error по tool_use_id, blocked</text><rect x="20" y="260" width="200" height="44" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="120" y="278.5" text-anchor="middle" font-size="12" fill="#1f2937">журнал не прочитан:</text><text x="120" y="293.5" text-anchor="middle" font-size="12" fill="#1f2937">{unavailable: true}, событие в лог</text><line x1="240" y1="204" x2="140" y2="260" stroke="#d97706" stroke-dasharray="4 3" marker-end="url(#mo)"/><text x="120" y="236" text-anchor="middle" font-size="11" fill="#d97706">сбой чтения</text><rect x="240" y="260" width="420" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="450" y="278.5" text-anchor="middle" font-size="12" fill="#1f2937">composeNote(status, text, journal)</text><text x="450" y="293.5" text-anchor="middle" font-size="12" fill="#1f2937">«Не всё выполнено» из blocked / error / started</text><line x1="450" y1="204" x2="450" y2="260" stroke="#16a34a" marker-end="url(#mg)"/><line x1="140" y1="304" x2="240" y2="340" stroke="#d97706" stroke-dasharray="4 3" marker-end="url(#mo)"/><rect x="240" y="340" width="420" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="450" y="358.5" text-anchor="middle" font-size="12" fill="#1f2937">agent_finish(status, text, journal)</text><text x="450" y="373.5" text-anchor="middle" font-size="12" fill="#1f2937">одним условным переходом</text><line x1="450" y1="304" x2="450" y2="340" stroke="#16a34a" marker-end="url(#mg)"/><rect x="700" y="340" width="260" height="56" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="830" y="364.5" text-anchor="middle" font-size="12" fill="#1f2937">reap по TTL: тот же журнал из</text><text x="830" y="379.5" text-anchor="middle" font-size="12" fill="#1f2937">последнего runs/&lt;id&gt;-*, by_ttl + journal</text><line x1="700" y1="368" x2="662" y2="368" stroke="#16a34a" marker-end="url(#mg)"/><rect x="60" y="450" width="260" height="52" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="190" y="472.5" text-anchor="middle" font-size="12" fill="#1f2937">review</text><text x="190" y="487.5" text-anchor="middle" font-size="12" fill="#1f2937">журнал, затем текст модели</text><line x1="450" y1="384" x2="190" y2="450" stroke="#16a34a" marker-end="url(#mg)"/><rect x="350" y="450" width="260" height="52" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="480" y="472.5" text-anchor="middle" font-size="12" fill="#1f2937">needs_info</text><text x="480" y="487.5" text-anchor="middle" font-size="12" fill="#1f2937">вопрос, затем журнал</text><line x1="450" y1="384" x2="480" y2="450" stroke="#16a34a" marker-end="url(#mg)"/><rect x="640" y="450" width="260" height="52" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="770" y="472.5" text-anchor="middle" font-size="12" fill="#1f2937">failed</text><text x="770" y="487.5" text-anchor="middle" font-size="12" fill="#1f2937">причина до 300, затем журнал</text><line x1="450" y1="384" x2="770" y2="450" stroke="#16a34a" marker-end="url(#mg)"/>
</svg>
