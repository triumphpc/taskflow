<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Повторная постановка: журнал прежней попытки попадает в промпт как данные</text><line x1="100" y1="84" x2="100" y2="426" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="300" y1="84" x2="300" y2="426" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="520" y1="84" x2="520" y2="426" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="730" y1="84" x2="730" y2="426" stroke="#9ca3af" stroke-dasharray="3 4"/><line x1="900" y1="84" x2="900" y2="426" stroke="#9ca3af" stroke-dasharray="3 4"/><rect x="38" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="100" y="68" text-anchor="middle" font-size="12" fill="#1f2937">Демон</text><rect x="238" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="300" y="68" text-anchor="middle" font-size="12" fill="#1f2937">mcp.mjs</text><rect x="458" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="520" y="60.5" text-anchor="middle" font-size="12" fill="#1f2937">sync.mjs</text><text x="520" y="75.5" text-anchor="middle" font-size="12" fill="#1f2937">js/agent.js</text><rect x="668" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="730" y="68" text-anchor="middle" font-size="12" fill="#1f2937">prompt.mjs</text><rect x="838" y="44" width="124" height="40" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="900" y="68" text-anchor="middle" font-size="12" fill="#1f2937">claude</text><line x1="102" y1="112" x2="298" y2="112" stroke="#6b7280" marker-end="url(#ma)"/><text x="200" y="106" text-anchor="middle" font-size="11" fill="#6b7280">agent_claim(task_id, today)</text>
<line x1="302" y1="144" x2="518" y2="144" stroke="#6b7280" marker-end="url(#ma)"/><text x="410" y="138" text-anchor="middle" font-size="11" fill="#6b7280">transition: claim</text>
<path d="M522,168 H566 V184 H524" fill="none" stroke="#16a34a" marker-end="url(#mg)"/><text x="572" y="179" text-anchor="start" font-size="11" fill="#16a34a">extractJournals(agentNotes, due)</text>
<line x1="518" y1="208" x2="302" y2="208" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#mg)"/><text x="410" y="202" text-anchor="middle" font-size="11" fill="#16a34a">ok, task, journals[≤3]</text>
<line x1="298" y1="240" x2="102" y2="240" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#mg)"/><text x="200" y="234" text-anchor="middle" font-size="11" fill="#16a34a">{ok, claimToken, task, journals}</text>
<line x1="102" y1="272" x2="728" y2="272" stroke="#16a34a" marker-end="url(#mg)"/><text x="415" y="266" text-anchor="middle" font-size="11" fill="#16a34a">buildPrompt(task, {send, previous})</text>
<path d="M732,296 H776 V312 H734" fill="none" stroke="#16a34a" marker-end="url(#mg)"/><text x="782" y="307" text-anchor="start" font-size="11" fill="#16a34a">блок previous_attempts: JSON, ≤2000</text>
<line x1="102" y1="336" x2="898" y2="336" stroke="#16a34a" marker-end="url(#mg)"/><text x="500" y="330" text-anchor="middle" font-size="11" fill="#16a34a">stdin: task_data + previous_attempts</text>
<rect x="390" y="360" width="500" height="42" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="640" y="377.5" text-anchor="middle" font-size="12" fill="#1f2937">В блок попадают только журналы с тем же сроком (due) задачи, что и сейчас:</text><text x="640" y="392.5" text-anchor="middle" font-size="12" fill="#1f2937">повтор серии с новым сроком или ручной перенос срока их не передают.</text>
