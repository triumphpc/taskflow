<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Компоненты: что добавляется к демону и процессу claude</text><text x="20" y="52" text-anchor="start" font-size="11" font-weight="bold" fill="#6b7280">Сервер TaskFlow</text><text x="300" y="52" text-anchor="start" font-size="11" font-weight="bold" fill="#6b7280">Демон (Mac, Node 18+)</text><text x="620" y="52" text-anchor="start" font-size="11" font-weight="bold" fill="#6b7280">Процесс claude</text><rect x="20" y="60" width="200" height="100" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="120" y="91.5" text-anchor="middle" font-size="12" fill="#1f2937">mcp.mjs + sync.mjs (изм.)</text><text x="120" y="106.5" text-anchor="middle" font-size="12" fill="#1f2937">agent_queue: features</text><text x="120" y="121.5" text-anchor="middle" font-size="12" fill="#1f2937">agent_claim: journals</text><text x="120" y="136.5" text-anchor="middle" font-size="12" fill="#1f2937">agent_finish: journal</text><rect x="20" y="190" width="200" height="100" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="120" y="221.5" text-anchor="middle" font-size="12" fill="#1f2937">js/agent.js (изм.)</text><text x="120" y="236.5" text-anchor="middle" font-size="12" fill="#1f2937">composeNote(…, journal)</text><text x="120" y="251.5" text-anchor="middle" font-size="12" fill="#1f2937">normalizeJournal</text><text x="120" y="266.5" text-anchor="middle" font-size="12" fill="#1f2937">extractJournals</text><line x1="120" y1="160" x2="120" y2="190" stroke="#6b7280" marker-end="url(#ma)"/><rect x="300" y="60" width="260" height="44" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="430" y="78.5" text-anchor="middle" font-size="12" fill="#1f2937">delegation-runner.mjs (изм.)</text><text x="430" y="93.5" text-anchor="middle" font-size="12" fill="#1f2937">режим, цикл, finish</text><rect x="300" y="120" width="260" height="44" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="430" y="138.5" text-anchor="middle" font-size="12" fill="#1f2937">policy.mjs (изм.)</text><text x="430" y="153.5" text-anchor="middle" font-size="12" fill="#1f2937">SEND_TOOLS, buildClaudeArgs</text><rect x="300" y="180" width="260" height="44" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="430" y="198.5" text-anchor="middle" font-size="12" fill="#1f2937">prompt.mjs (изм.)</text><text x="430" y="213.5" text-anchor="middle" font-size="12" fill="#1f2937">два промпта, previous_attempts</text><rect x="300" y="240" width="260" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="430" y="258.5" text-anchor="middle" font-size="12" fill="#1f2937">run-dir.mjs</text><text x="430" y="273.5" text-anchor="middle" font-size="12" fill="#1f2937">каталог прогона, очистка 14 дней</text><rect x="300" y="300" width="260" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="430" y="318.5" text-anchor="middle" font-size="12" fill="#1f2937">audit.mjs</text><text x="430" y="333.5" text-anchor="middle" font-size="12" fill="#1f2937">запись, чтение, buildJournal</text><rect x="620" y="60" width="240" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="740" y="86.5" text-anchor="middle" font-size="12" fill="#1f2937">агент + субагенты</text><text x="740" y="101.5" text-anchor="middle" font-size="12" fill="#1f2937">dontAsk, SEND_TOOLS вне allow</text><rect x="620" y="170" width="240" height="60" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="740" y="196.5" text-anchor="middle" font-size="12" fill="#1f2937">send-gate.mjs</text><text x="740" y="211.5" text-anchor="middle" font-size="12" fill="#1f2937">pre (allow/deny), post, fail</text><rect x="620" y="250" width="240" height="60" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="740" y="276.5" text-anchor="middle" font-size="12" fill="#1f2937">send-policy.mjs, send-targets.mjs</text><text x="740" y="291.5" text-anchor="middle" font-size="12" fill="#1f2937">send-slots.mjs, audit.mjs</text><rect x="910" y="60" width="120" height="120" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="970" y="86.5" text-anchor="middle" font-size="12" fill="#1f2937">Внешние MCP</text><text x="970" y="101.5" text-anchor="middle" font-size="12" fill="#1f2937"></text><text x="970" y="116.5" text-anchor="middle" font-size="12" fill="#1f2937">VK Teams</text><text x="970" y="131.5" text-anchor="middle" font-size="12" fill="#1f2937">GitLab</text><text x="970" y="146.5" text-anchor="middle" font-size="12" fill="#1f2937">Jira</text><text x="970" y="161.5" text-anchor="middle" font-size="12" fill="#1f2937">Confluence</text><rect x="610" y="400" width="210" height="54" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="715" y="423.5" text-anchor="middle" font-size="12" fill="#1f2937">runs/&lt;id&gt;-&lt;ts&gt;/</text><text x="715" y="438.5" text-anchor="middle" font-size="12" fill="#1f2937">meta.json, slots/, audit.jsonl</text><rect x="840" y="400" width="200" height="54" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="940" y="423.5" text-anchor="middle" font-size="12" fill="#1f2937">send-policy.json</text><text x="940" y="438.5" text-anchor="middle" font-size="12" fill="#1f2937">~/.config/taskflow-agent, 0600</text><line x1="300" y1="82" x2="220" y2="82" stroke="#6b7280" marker-end="url(#ma)"/><text x="260" y="74" text-anchor="middle" font-size="11" fill="#6b7280">claim, finish</text><line x1="560" y1="82" x2="620" y2="82" stroke="#6b7280" marker-end="url(#ma)"/><text x="590" y="74" text-anchor="middle" font-size="11" fill="#6b7280">spawn</text><line x1="740" y1="120" x2="740" y2="170" stroke="#16a34a" marker-end="url(#mg)"/><text x="750" y="150" text-anchor="start" font-size="11" fill="#16a34a">PreToolUse, Post…</text><line x1="740" y1="230" x2="740" y2="250" stroke="#16a34a" marker-end="url(#mg)"/><line x1="860" y1="90" x2="910" y2="90" stroke="#6b7280" marker-end="url(#ma)"/><text x="885" y="82" text-anchor="middle" font-size="11" fill="#6b7280">MCP</text><line x1="690" y1="310" x2="690" y2="400" stroke="#16a34a" marker-end="url(#mg)"/><text x="698" y="360" text-anchor="start" font-size="11" fill="#16a34a">слоты, audit</text><line x1="850" y1="310" x2="900" y2="400" stroke="#16a34a" marker-end="url(#mg)"/><text x="890" y="352" text-anchor="start" font-size="11" fill="#16a34a">читает каждый раз</text><line x1="560" y1="330" x2="640" y2="400" stroke="#16a34a" marker-end="url(#mg)"/><text x="590" y="392" text-anchor="end" font-size="11" fill="#16a34a">читает audit</text><rect x="20" y="490" width="14" height="14" rx="2" fill="#e3f2e7" stroke="#16a34a"/><text x="40" y="501" text-anchor="start" font-size="11" fill="#6b7280">новое</text><rect x="190" y="490" width="14" height="14" rx="2" fill="#ffffff" stroke="#9ca3af"/><text x="210" y="501" text-anchor="start" font-size="11" fill="#6b7280">есть (изм. = меняется)</text>
</svg>
