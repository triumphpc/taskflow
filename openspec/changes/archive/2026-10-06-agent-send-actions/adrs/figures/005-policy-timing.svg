<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" font-size="13" font-weight="bold" fill="#1f2937">Что читается когда: выключатель при запуске прогона, белый список на каждом вызове</text>
<line x1="180" y1="290" x2="880" y2="290" stroke="#9ca3af"/><text x="180" y="312" fill="#6b7280" font-size="11">время прогона (до 15 минут)</text>
<line x1="230" y1="285" x2="230" y2="295" stroke="#9ca3af"/><text x="230" y="278" text-anchor="middle" fill="#6b7280" font-size="11">старт claude</text>
<line x1="850" y1="285" x2="850" y2="295" stroke="#9ca3af"/><text x="850" y="278" text-anchor="middle" fill="#6b7280" font-size="11">конец</text>
<text x="20" y="75" fill="#1f2937" font-weight="bold">env-файл</text><text x="20" y="91" fill="#6b7280" font-size="11">TASKFLOW_AGENT_SEND</text>
<rect x="190" y="60" width="80" height="38" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="230" y="76" text-anchor="middle" fill="#1f2937">читает демон</text><text x="230" y="90" text-anchor="middle" fill="#1f2937">один раз</text>
<line x1="270" y1="79" x2="330" y2="79" stroke="#16a34a" marker-end="url(#g)"/>
<text x="340" y="75" fill="#1f2937">выбор набора запуска: с send (gate + промпт отправки)</text><text x="340" y="91" fill="#1f2937">или только чтение (как до change). Не меняется до конца прогона.</text>
<text x="20" y="165" fill="#1f2937" font-weight="bold">send-policy.json</text><text x="20" y="181" fill="#6b7280" font-size="11">белый список, потолки</text>
<g fill="#e3f2e7" stroke="#16a34a">
<rect x="300" y="150" width="14" height="38" rx="2"/><rect x="420" y="150" width="14" height="38" rx="2"/><rect x="560" y="150" width="14" height="38" rx="2"/><rect x="690" y="150" width="14" height="38" rx="2"/>
</g>
<text x="307" y="145" text-anchor="middle" fill="#6b7280" font-size="11">вызов 1</text><text x="427" y="145" text-anchor="middle" fill="#6b7280" font-size="11">вызов 2</text><text x="567" y="145" text-anchor="middle" fill="#6b7280" font-size="11">вызов 3</text><text x="697" y="145" text-anchor="middle" fill="#6b7280" font-size="11">вызов 4</text>
<text x="190" y="205" fill="#1f2937">gate читает файл заново на каждом вызове send-инструмента: правка действует со следующего вызова</text>
<text x="190" y="223" fill="#1f2937">нет файла, неверные права, битый JSON или неизвестный ключ: отказ на этом вызове (fail-closed)</text>
<line x1="490" y1="244" x2="490" y2="232" stroke="#d97706"/>
<rect x="395" y="244" width="190" height="26" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="490" y="261" text-anchor="middle" fill="#1f2937">аварийно: очистить списки в файле</text>
</svg>
