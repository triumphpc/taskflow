<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" font-size="13" font-weight="bold" fill="#1f2937">Два хука PreToolUse на одном вызове: confirm-outbound.sh из агента и gate из --settings</text>
<rect x="20" y="120" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="95" y="146" text-anchor="middle" fill="#1f2937">вызов send-инструмента</text>
<rect x="300" y="55" width="260" height="62" rx="4" fill="#fff" stroke="#9ca3af"/><text x="430" y="76" text-anchor="middle" fill="#1f2937" font-weight="bold">confirm-outbound.sh</text><text x="430" y="94" text-anchor="middle" fill="#6b7280" font-size="11">без AUTONOMOUS_RUN: ask (определение headless</text><text x="430" y="108" text-anchor="middle" fill="#6b7280" font-size="11">по предкам процесса, под dontAsk ask = отказ)</text>
<rect x="300" y="165" width="260" height="62" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="430" y="186" text-anchor="middle" fill="#1f2937" font-weight="bold">send-gate</text><text x="430" y="204" text-anchor="middle" fill="#6b7280" font-size="11">белый список, потолок, запись попытки</text><text x="430" y="218" text-anchor="middle" fill="#6b7280" font-size="11">решение: allow или deny</text>
<line x1="170" y1="135" x2="298" y2="95" stroke="#6b7280" marker-end="url(#a)"/><line x1="170" y1="150" x2="298" y2="195" stroke="#6b7280" marker-end="url(#a)"/>
<rect x="650" y="55" width="230" height="62" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="765" y="78" text-anchor="middle" fill="#1f2937">AUTONOMOUS_RUN=1 в окружении</text><text x="765" y="96" text-anchor="middle" fill="#1f2937">claude: хук молчит (exit 0)</text><text x="765" y="110" text-anchor="middle" fill="#6b7280" font-size="11">явный флаг вместо догадки по предкам</text>
<line x1="560" y1="86" x2="648" y2="86" stroke="#d97706" marker-end="url(#a)"/>
<rect x="650" y="165" width="230" height="62" rx="4" fill="#fff" stroke="#9ca3af"/><text x="765" y="192" text-anchor="middle" fill="#1f2937">итог: решает gate</text><text x="765" y="210" text-anchor="middle" fill="#6b7280" font-size="11">allow только если ask от первого хука нет</text>
<line x1="560" y1="196" x2="648" y2="196" stroke="#16a34a" marker-end="url(#g)"/>
<line x1="765" y1="117" x2="765" y2="163" stroke="#d97706" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="20" y="275" fill="#1f2937">Системный промпт отдельно говорит агенту: делегирование и есть явный запрос (эквивалент options.send: true).</text>
<text x="20" y="295" fill="#6b7280" font-size="11">Без этой фразы агент 102 по собственному правилу «превью до отправки» вернёт BLOCKED_ON_APPROVAL, даже если инструмент разрешён.</text>
</svg>
