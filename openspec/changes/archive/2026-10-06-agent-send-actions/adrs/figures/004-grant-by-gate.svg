<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="13" font-weight="bold" fill="#dc2626">Вариант C (отвергнут): send-инструменты в --allowedTools, хук как дополнительный фильтр</text>
<rect x="20" y="50" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="95" y="76" text-anchor="middle" fill="#1f2937">вызов send-инструмента</text>
<rect x="230" y="50" width="160" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="310" y="68" text-anchor="middle" fill="#1f2937">allowedTools:</text><text x="310" y="84" text-anchor="middle" fill="#1f2937">send-инструменты есть</text>
<rect x="450" y="50" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="525" y="76" text-anchor="middle" fill="#1f2937">хук-фильтр</text>
<rect x="710" y="50" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="785" y="76" text-anchor="middle" fill="#1f2937">MCP: отправка</text>
<line x1="170" y1="72" x2="228" y2="72" stroke="#6b7280" marker-end="url(#a)"/>
<line x1="390" y1="72" x2="448" y2="72" stroke="#6b7280" marker-end="url(#a)"/><text x="394" y="64" fill="#6b7280" font-size="11">allow по имени</text>
<line x1="600" y1="72" x2="708" y2="72" stroke="#6b7280" marker-end="url(#a)"/><text x="618" y="64" fill="#6b7280" font-size="11">хук одобрил</text>
<rect x="450" y="125" width="150" height="44" rx="4" fill="#fbe9e7" stroke="#dc2626"/><text x="525" y="144" text-anchor="middle" fill="#1f2937">хук упал, завис</text><text x="525" y="160" text-anchor="middle" fill="#1f2937">или не загрузился</text>
<line x1="525" y1="94" x2="525" y2="123" stroke="#dc2626" stroke-dasharray="4 3" marker-end="url(#r)"/>
<path d="M600,147 H785 V96" fill="none" stroke="#dc2626" marker-end="url(#r)"/><text x="640" y="140" fill="#dc2626" font-size="11">отправка проходит без проверки</text>
<line x1="20" y1="205" x2="880" y2="205" stroke="#e5e7eb"/>
<text x="20" y="232" font-size="13" font-weight="bold" fill="#16a34a">Вариант D (принят): send-инструментов в --allowedTools нет, право выдаёт gate на каждый вызов</text>
<rect x="20" y="255" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="95" y="281" text-anchor="middle" fill="#1f2937">вызов send-инструмента</text>
<rect x="230" y="255" width="160" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="310" y="273" text-anchor="middle" fill="#1f2937">allowedTools:</text><text x="310" y="289" text-anchor="middle" fill="#1f2937">send-инструментов нет</text>
<rect x="450" y="255" width="150" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="525" y="273" text-anchor="middle" fill="#1f2937">gate: белый список,</text><text x="525" y="289" text-anchor="middle" fill="#1f2937">потолок, allow</text>
<rect x="710" y="255" width="150" height="44" rx="4" fill="#fff" stroke="#9ca3af"/><text x="785" y="281" text-anchor="middle" fill="#1f2937">MCP: отправка</text>
<line x1="170" y1="277" x2="228" y2="277" stroke="#6b7280" marker-end="url(#a)"/>
<line x1="390" y1="277" x2="448" y2="277" stroke="#6b7280" marker-end="url(#a)"/><text x="394" y="269" fill="#6b7280" font-size="11">нужен grant</text>
<line x1="600" y1="277" x2="708" y2="277" stroke="#16a34a" marker-end="url(#g)"/><text x="618" y="269" fill="#16a34a" font-size="11">grant на вызов</text>
<rect x="450" y="330" width="150" height="44" rx="4" fill="#fdf0dd" stroke="#d97706"/><text x="525" y="349" text-anchor="middle" fill="#1f2937">gate упал, завис</text><text x="525" y="365" text-anchor="middle" fill="#1f2937">или не загрузился</text>
<line x1="525" y1="299" x2="525" y2="328" stroke="#d97706" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="710" y="330" width="150" height="44" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="785" y="349" text-anchor="middle" fill="#1f2937">dontAsk: отказ,</text><text x="785" y="365" text-anchor="middle" fill="#1f2937">вызова нет</text>
<line x1="600" y1="352" x2="708" y2="352" stroke="#16a34a" marker-end="url(#g)"/><text x="612" y="344" fill="#16a34a" font-size="11">нет grant</text>
</svg>
