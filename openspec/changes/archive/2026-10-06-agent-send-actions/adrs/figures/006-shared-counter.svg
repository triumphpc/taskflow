<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Arial, Helvetica, sans-serif" font-size="12">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" font-size="13" font-weight="bold" fill="#1f2937">Один счётчик на прогон: основной агент и субагенты берут слоты в одном каталоге</text>
<rect x="20" y="60" width="170" height="40" rx="4" fill="#fff" stroke="#9ca3af"/><text x="105" y="84" text-anchor="middle" fill="#1f2937">основной агент</text>
<rect x="20" y="130" width="170" height="40" rx="4" fill="#fff" stroke="#9ca3af"/><text x="105" y="154" text-anchor="middle" fill="#1f2937">субагент ai-space-comms</text>
<rect x="20" y="200" width="170" height="40" rx="4" fill="#fff" stroke="#9ca3af"/><text x="105" y="224" text-anchor="middle" fill="#1f2937">субагент (параллельно)</text>
<rect x="330" y="110" width="150" height="80" rx="4" fill="#e3f2e7" stroke="#16a34a"/><text x="405" y="143" text-anchor="middle" fill="#1f2937">gate</text><text x="405" y="161" text-anchor="middle" fill="#6b7280" font-size="11">тот же процесс-скрипт,</text><text x="405" y="175" text-anchor="middle" fill="#6b7280" font-size="11">та же командная строка</text>
<line x1="190" y1="80" x2="328" y2="130" stroke="#6b7280" marker-end="url(#a)"/>
<line x1="190" y1="150" x2="328" y2="150" stroke="#6b7280" marker-end="url(#a)"/><text x="215" y="143" fill="#6b7280" font-size="11">send вызов</text>
<line x1="190" y1="220" x2="328" y2="172" stroke="#6b7280" marker-end="url(#a)"/>
<rect x="580" y="60" width="300" height="200" rx="4" fill="#fff" stroke="#9ca3af"/>
<text x="595" y="82" fill="#1f2937" font-weight="bold">runs/&lt;задача&gt;-&lt;прогон&gt;/slots/</text>
<g font-size="11" fill="#1f2937">
<rect x="595" y="94" width="120" height="22" fill="#e3f2e7" stroke="#16a34a"/><text x="655" y="109" text-anchor="middle">vk-1 (основной)</text>
<rect x="595" y="122" width="120" height="22" fill="#e3f2e7" stroke="#16a34a"/><text x="655" y="137" text-anchor="middle">vk-2 (comms)</text>
<rect x="595" y="150" width="120" height="22" fill="#e3f2e7" stroke="#16a34a"/><text x="655" y="165" text-anchor="middle">vk-3 (comms)</text>
<rect x="595" y="178" width="120" height="22" fill="#fbe9e7" stroke="#dc2626" stroke-dasharray="4 3"/><text x="655" y="193" text-anchor="middle">vk-4 (занято)</text>
</g>
<text x="730" y="109" fill="#6b7280" font-size="11">создание файла O_EXCL</text><text x="730" y="123" fill="#6b7280" font-size="11">атомарно: два параллельных</text><text x="730" y="137" fill="#6b7280" font-size="11">вызова не получат один слот</text>
<text x="730" y="193" fill="#dc2626" font-size="11">слотов больше нет: блок</text>
<line x1="480" y1="150" x2="578" y2="150" stroke="#16a34a" marker-end="url(#g)"/><text x="486" y="142" fill="#16a34a" font-size="11">взять слот</text>
<text x="20" y="290" fill="#1f2937">Счётчик привязан к каталогу прогона, который создаёт демон, а не к session_id и не к agent_id.</text>
<text x="20" y="310" fill="#6b7280" font-size="11">Каталог передаётся в командной строке хука, поэтому субагенты не могут завести свой счётчик с нуля.</text>
</svg>
