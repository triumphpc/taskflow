<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Один переход: данные в t=0, защита ввода, посадка в t=350</text><rect x="5" y="40" width="110" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="60" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="60" y1="70" x2="60" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="155" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="210" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">обработчик</text><line x1="210" y1="70" x2="210" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="305" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="360" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">gate (чистый)</text><line x1="360" y1="70" x2="360" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="445" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="500" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">model.js</text><line x1="500" y1="70" x2="500" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="595" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="650" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">слайд и ghost</text><line x1="650" y1="70" x2="650" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="755" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="810" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">лоток</text><line x1="810" y1="70" x2="810" y2="515" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><polyline points="60,100 210,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="135" y="94" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">1. клик «✓ Уже сделано»</text><polyline points="210,130 360,130" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="285" y="124" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">2. lock(act)</text><polyline points="360,156 210,156" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="285" y="150" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">3. true: idle → locked, act()</text><polyline points="210,186 500,186" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="355" y="180" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">4. M.toggleDone(id)  (t=0)</text><polyline points="210,216 650,216" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="430" y="210" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">5. ghost = clone; step(): новый слайд</text><polyline points="210,246 810,246" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="510" y="240" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">6. advance(from, to, цель шара)</text><rect x="656" y="262" width="196.79999999999998" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="662" y="276" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">7. анимации: 0–200, 120–350, 150–350</text><polyline points="60,318 210,318" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="135" y="312" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">8. второй клик в t=100</text><polyline points="210,344 360,344" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="285" y="338" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">9. lock(act)</text><polyline points="360,370 210,370" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-orange)"/><text x="285" y="364" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">10. false: no-op</text><polyline points="650,412 210,412" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="430" y="406" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">11. allSettled (cancel не ждём)</text><rect x="216" y="426" width="308.79999999999995" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="222" y="440" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">12. gate.state ≠ closed → land(): бейдж виден, ghost снят</text><polyline points="210,478 360,478" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="285" y="472" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">13. unlock(): locked → idle</text></svg>