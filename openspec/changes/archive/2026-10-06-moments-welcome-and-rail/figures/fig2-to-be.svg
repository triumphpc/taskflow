<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="28" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Как станет: та же проекция, изменённое выделено зелёным</text><rect x="10" y="60" width="160" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="90" y="88.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">m или кнопка ◎</text><text x="90" y="103.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">app.js, без правок</text><rect x="190" y="60" width="160" height="64" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openMoments()</text><text x="270" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">now и очередь: 1 раз</text><text x="270" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">active до закрытия</text><rect x="370" y="60" width="160" height="64" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="450" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">playIntro(queue)</text><text x="450" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">приветствие, россыпь,</text><text x="450" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">пирамида, ряд · 2,6 с</text><rect x="550" y="60" width="160" height="64" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="630" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">передача без мигания</text><text x="630" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">та же раскладка слотов,</text><text x="630" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">тот же кадр</text><rect x="730" y="60" width="160" height="64" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="810" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openSheet + лоток</text><text x="810" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">заголовок с датой,</text><text x="810" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">лоток внизу шторки</text><polyline points="170,92 190,92" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><polyline points="350,92 370,92" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><polyline points="530,92 550,92" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><polyline points="710,92 730,92" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="180" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">keydown</text><text x="360" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">now, queue</text><text x="540" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">done | skipped</text><text x="720" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">.then(entry)</text><polyline points="810,124 810,170 120,170 120,200" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="460" y="164" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">шторка открыта, шар первой карточки на месте</text><rect x="10" y="200" width="220" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="120" y="229" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">5 путей ответа</text><text x="120" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">пикер, ✓, ✕, ↷,</text><text x="120" y="259" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">«Пропустить»</text><rect x="280" y="200" width="200" height="80" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="380" y="229" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">gate.lock(act)</text><text x="380" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">M.* сразу, до анимации</text><text x="380" y="259" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">повторный вызов: no-op</text><rect x="530" y="200" width="360" height="80" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="710" y="221.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">переход 350 мс</text><text x="710" y="236.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">карточка и её шар уезжают вправо</text><text x="710" y="251.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">шар лотка катится на новую карточку</text><text x="710" y="266.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">лоток сдвигается, новая карточка въезжает</text><polyline points="230,240 280,240" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="255" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">ответ</text><polyline points="480,240 530,240" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="505" y="232" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">ghost</text><rect x="10" y="320" width="430" height="76" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="225" y="347" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Закрытие в любой момент</text><text x="225" y="362" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">✕, Esc, клик по оверлею, «✎»: onClose → gate.close,</text><text x="225" y="377" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">отмена анимаций, лоток уходит с оверлеем</text><rect x="460" y="320" width="430" height="76" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5"/><text x="675" y="347" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Без движения</text><text x="675" y="362" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">reduced-motion или нет WAAPI: без оверлея, лотка и</text><text x="675" y="377" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">переходов; дата и число остаются в заголовке</text><rect x="10" y="440" width="14" height="14" rx="0" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="32" y="452" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">зелёный: новое или изменённое</text><rect x="290" y="440" width="14" height="14" rx="0" fill="#fdf0dd" stroke="#d97706" stroke-width="1"/><text x="312" y="452" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">оранжевый: путь без анимации</text></svg>