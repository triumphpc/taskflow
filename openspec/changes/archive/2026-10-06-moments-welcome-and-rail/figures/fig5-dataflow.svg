<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Путь одного входа в Moments: от клавиши до ответа на карточку</text><rect x="5" y="40" width="110" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="60" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="60" y1="70" x2="60" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="135" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="190" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">app.js</text><line x1="190" y1="70" x2="190" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="275" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="330" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments.js</text><line x1="330" y1="70" x2="330" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="435" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="490" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments-intro</text><line x1="490" y1="70" x2="490" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="595" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="650" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">чистые модули</text><line x1="650" y1="70" x2="650" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="755" y="40" width="110" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="810" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">шторка + лоток</text><line x1="810" y1="70" x2="810" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><polyline points="60,100 190,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="125" y="94" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">1. m / ◎</text><polyline points="190,130 330,130" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="260" y="124" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">2. openMoments()</text><rect x="336" y="146" width="140.79999999999998" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="342" y="160" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">3. очередь и now: один раз</text><polyline points="330,190 650,190" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="490" y="184" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">4. greetingParts, sheetTitle</text><polyline points="330,226 490,226" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="410" y="220" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">5. playIntro(queue)</text><polyline points="490,256 650,256" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="570" y="250" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">6. buildIntro(queue, view)</text><rect x="496" y="272" width="247.2" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="502" y="286" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">7. 2,6 с: приветствие, россыпь, пирамида, ряд</text><polyline points="60,322 490,322" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="275" y="316" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">8. тап, клавиша или таймер</text><polyline points="490,352 330,352" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="410" y="346" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">9. 'done' | 'skipped'</text><polyline points="330,388 810,388" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="570" y="382" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">10. openSheet(overlayClass), rail.show</text><polyline points="810,418 60,418" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="435" y="412" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">11. шторка, лоток, шар на карточке</text><polyline points="60,466 330,466" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="195" y="460" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">12. ответ: один из 5 путей</text><polyline points="330,496 650,496" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="490" y="490" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">13. gate.lock(act)</text><rect x="336" y="512" width="264" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="342" y="526" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">14. M.updateTask / toggleDone / deleteTask: сразу</text><polyline points="330,556 810,556" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="570" y="550" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">15. ghost, полёт шара, сдвиг, въезд</text><polyline points="810,586 330,586" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="570" y="580" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">16. allSettled → gate.unlock</text></svg>