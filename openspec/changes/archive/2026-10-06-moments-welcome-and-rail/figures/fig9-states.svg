<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Состояния сессии Moments: интро, gate (idle ⇄ locked), закрыто</text><rect x="20" y="44" width="130" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="85" y="62.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">вход</text><text x="85" y="77.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">openMoments()</text><rect x="220" y="44" width="170" height="44" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="305" y="62.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">INTRO</text><text x="305" y="77.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">оверлей, 2,6 с</text><polyline points="150,66 220,66" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="185" y="38" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="normal">есть движение</text><rect x="180" y="112" width="700" height="372" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190" y="130" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">шторка открыта: gate</text><rect x="200" y="150" width="190" height="56" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="295" y="174.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">locked: первый шар</text><text x="295" y="189.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">катится на карточку, 260 мс</text><rect x="420" y="270" width="150" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="495" y="294.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">idle</text><text x="495" y="309.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">ввод принимается</text><rect x="660" y="210" width="200" height="56" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="760" y="234.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">locked: переход</text><text x="760" y="249.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">350 мс, ввод игнорируется</text><rect x="660" y="350" width="200" height="56" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="760" y="374.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">locked: последний уход</text><text x="760" y="389.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">карточка уезжает, 200 мс</text><rect x="420" y="420" width="190" height="50" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="515" y="441.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">День распланирован</text><text x="515" y="456.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">idle, лоток пуст</text><rect x="20" y="420" width="130" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="85" y="441.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">closed</text><text x="85" y="456.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">терминальное</text><polyline points="305,88 305,150" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="311" y="124" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">'done'</text><polyline points="390,66 495,66 495,270" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="500" y="100" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">'skipped': шар уже на карточке</text><polyline points="85,88 85,306 420,306" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="100" y="322" font-size="11" fill="#d97706" text-anchor="start" font-weight="normal">без движения (entry static): интро и лотка нет</text><polyline points="295,206 295,290 420,290" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="300" y="262" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">посадка</text><polyline points="570,284 660,240" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="600" y="252" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">ответ</text><polyline points="660,256 570,300" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="626" y="306" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">посадка, unlock</text><polyline points="500,326 500,378 660,378" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="510" y="372" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">ответ на последнюю</text><polyline points="660,400 610,440" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="636" y="436" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">ghost ушёл</text><polyline points="180,445 150,445" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="165" y="416" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">close</text><text x="20" y="508" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">close: ✕, Esc, клик по оверлею из любого состояния шторки; «✎ Открыть задачу» только из idle. Все пути: gate.close(), cancel анимаций.</text></svg>