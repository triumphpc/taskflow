<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Закрытие шторки посреди перехода: всё отменяется, продолжения нет</text><rect x="0" y="40" width="120" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="60" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="60" y1="70" x2="60" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="160" y="40" width="120" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="220" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openSheet.close</text><line x1="220" y1="70" x2="220" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="320" y="40" width="120" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="380" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">onClose (moments)</text><line x1="380" y1="70" x2="380" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="460" y="40" width="120" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="520" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">gate</text><line x1="520" y1="70" x2="520" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="610" y="40" width="120" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="670" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">анимации, ghost</text><line x1="670" y1="70" x2="670" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><rect x="760" y="40" width="120" height="30" rx="6" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="820" y="59" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ctx.refresh</text><line x1="820" y1="70" x2="820" y2="470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><polyline points="60,100 220,100" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="140" y="94" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">1. ✕, Esc или клик по оверлею (t=150)</text><rect x="226" y="116" width="297.59999999999997" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="232" y="130" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">2. overlay.remove(): лоток и ghost уходят вместе с ним</text><polyline points="220,168 380,168" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="300" y="162" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">3. onClose()</text><polyline points="380,198 520,198" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="450" y="192" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">4. close(): любое состояние → closed</text><polyline points="380,228 670,228" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="525" y="222" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">5. cancel() всех, clearTimeout(watchdog)</text><polyline points="380,258 820,258" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="600" y="252" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">6. ctx.refresh()</text><polyline points="670,306 380,306" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="525" y="300" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">7. allSettled: AbortError проглочен</text><rect x="386" y="322" width="297.59999999999997" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1"/><text x="392" y="336" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">8. gate.state === 'closed' → return: step() не зовётся</text><rect x="20" y="372" width="420" height="70" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5"/><text x="230" y="396" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">«✎ Открыть задачу»</text><text x="230" y="411" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">вне перехода: ifIdle → close() → openEditor(id)</text><text x="230" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">во время перехода: ifIdle вернул false, ничего</text><rect x="460" y="372" width="420" height="70" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="670" y="396" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">После закрытия</text><text x="670" y="411" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">в #modal-root пусто, таймеров и анимаций нет,</text><text x="670" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">список обновлён, как и до этого изменения</text></svg>