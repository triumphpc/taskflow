<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="22" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Лоток на 390 px: шаг 29 px, при нехватке места счётчик занимает последний слот</text><text x="20" y="52" font-size="11" fill="#1f2937" text-anchor="start" font-weight="bold">индекс −1 (после интро): 20 задач, видно 11 и «+9»</text><rect x="20" y="60" width="390" height="44" rx="0" fill="#fdf0dd" stroke="#d97706" stroke-width="1"/><rect x="36" y="64" width="358" height="36" rx="0" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/><circle cx="50" cy="82" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="79.12" cy="82" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="108.24000000000001" cy="82" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="137.36" cy="82" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><circle cx="166.48000000000002" cy="82" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="195.6" cy="82" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="224.72" cy="82" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="253.84" cy="82" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><circle cx="282.96000000000004" cy="82" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="312.08" cy="82" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="341.2" cy="82" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><rect x="356.32" y="68" width="28" height="28" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="370.32" y="86" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal">+9</text><text x="20" y="142" font-size="11" fill="#1f2937" text-anchor="start" font-weight="bold">индекс 3: осталось 16, видно 11 и «+5»</text><rect x="20" y="150" width="390" height="44" rx="0" fill="#fdf0dd" stroke="#d97706" stroke-width="1"/><rect x="36" y="154" width="358" height="36" rx="0" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/><circle cx="50" cy="172" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="79.12" cy="172" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="108.24000000000001" cy="172" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="137.36" cy="172" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><circle cx="166.48000000000002" cy="172" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="195.6" cy="172" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="224.72" cy="172" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="253.84" cy="172" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><circle cx="282.96000000000004" cy="172" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="312.08" cy="172" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="341.2" cy="172" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><rect x="356.32" y="158" width="28" height="28" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="370.32" y="176" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal">+5</text><text x="20" y="232" font-size="11" fill="#1f2937" text-anchor="start" font-weight="bold">индекс 12: осталось 7, счётчика нет</text><rect x="20" y="240" width="390" height="44" rx="0" fill="#fdf0dd" stroke="#d97706" stroke-width="1"/><rect x="36" y="244" width="358" height="36" rx="0" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/><circle cx="50" cy="262" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="79.12" cy="262" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="108.24000000000001" cy="262" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><circle cx="137.36" cy="262" r="14" fill="#e5484d" stroke="#1f2937" stroke-width="0.8"/><circle cx="166.48000000000002" cy="262" r="14" fill="#e8930c" stroke="#1f2937" stroke-width="0.8"/><circle cx="195.6" cy="262" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="0.8"/><circle cx="224.72" cy="262" r="14" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.8"/><text x="20" y="318" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Правило: d = наибольший из 56…28, при котором влезают все total шаров; иначе 28.</text><text x="20" y="336" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Слот: x = rowX + k·pitch, pitch = 1,04·d. d выбирается один раз на сессию.</text><text x="20" y="354" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Ушёл шар: слот 0 уходит на карточку, остальные сдвигаются на один pitch влево,</text><text x="20" y="372" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">из счётчика в последний видимый слот приходит следующий, K уменьшается.</text><text x="20" y="400" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Пунктир: рабочая ширина ряда min(ширина − 32, 560). На десктопе ряд стоит</text><text x="20" y="418" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">ровно под шторкой, на телефоне по краям с полем 16 px.</text><rect x="520" y="44" width="195" height="422" rx="10" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5"/><rect x="526" y="78" width="183" height="341" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="618" y="164" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">шторка</text><text x="618" y="182" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">max-height:</text><text x="618" y="198" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">92vh − rail-h − 8px</text><text x="618" y="216" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">тело прокручивается,</text><text x="618" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">подвал виден целиком</text><rect x="520" y="427" width="195" height="39" rx="0" fill="#fdf0dd" stroke="#d97706" stroke-width="1"/><circle cx="535" cy="438" r="7" fill="#e5484d" stroke="#1f2937" stroke-width="0.5"/><circle cx="549.5" cy="438" r="7" fill="#e8930c" stroke="#1f2937" stroke-width="0.5"/><circle cx="564" cy="438" r="7" fill="#3b82f6" stroke="#1f2937" stroke-width="0.5"/><circle cx="578.5" cy="438" r="7" fill="#9aa2b1" stroke="#1f2937" stroke-width="0.5"/><circle cx="593" cy="438" r="7" fill="#e5484d" stroke="#1f2937" stroke-width="0.5"/><circle cx="607.5" cy="438" r="7" fill="#e8930c" stroke="#1f2937" stroke-width="0.5"/><rect x="520" y="449" width="195" height="17" rx="0" fill="#e5e7eb" stroke="none" stroke-width="1"/><text x="618" y="461" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">safe-area-inset-bottom</text><text x="618" y="488" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">390x844: rail-h = 44 + safe-b</text></svg>