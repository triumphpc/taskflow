<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="20" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Сценарий интро: 2,6 с оверлея и 0,26 с на посадку первого шара</text><text x="260" y="98" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">затемнение, приветствие</text><rect x="270" y="84" width="52.447552447552425" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><rect x="322.4475524475524" y="84" width="262.23776223776224" height="20" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="453.56643356643355" y="98" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">читается 1,25 с</text><rect x="584.6853146853147" y="84" width="62.93706293706293" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="132" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">шары возникают (россыпь)</text><rect x="270" y="118" width="82.65734265734267" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="166" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">россыпь → пирамида, по очереди</text><rect x="479.7902097902098" y="152" width="144.33566433566432" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="200" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">пульс пирамиды</text><rect x="626.6433566433566" y="186" width="41.95804195804203" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="234" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">пирамида → лоток, по одному</text><rect x="668.6013986013986" y="220" width="144.33566433566432" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="268" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">шары сверх 15 и счётчик +K</text><rect x="773.4965034965035" y="254" width="41.95804195804203" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="260" y="302" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">шар №1 катится на карточку</text><rect x="815.4545454545455" y="288" width="54.545454545454504" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><line x1="270" y1="328" x2="870" y2="328" stroke="#9ca3af" stroke-width="1.5"/><line x1="270" y1="328" x2="270" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="270" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text><line x1="374.8951048951049" y1="328" x2="374.8951048951049" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="374.8951048951049" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">500</text><line x1="479.7902097902098" y1="328" x2="479.7902097902098" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="479.7902097902098" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">1000</text><line x1="584.6853146853147" y1="328" x2="584.6853146853147" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="584.6853146853147" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">1500</text><line x1="689.5804195804196" y1="328" x2="689.5804195804196" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="689.5804195804196" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">2000</text><line x1="794.4755244755245" y1="328" x2="794.4755244755245" y2="333" stroke="#9ca3af" stroke-width="1.5"/><text x="794.4755244755245" y="346" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">2500</text><text x="870" y="346" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">мс</text><line x1="815.4545454545455" y1="74" x2="815.4545454545455" y2="328" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="809.4545454545455" y="58" font-size="11" fill="#16a34a" text-anchor="end" font-weight="normal">передача: INTRO_TOTAL 2600</text><line x1="870" y1="74" x2="870" y2="328" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="870" y="72" font-size="11" fill="#16a34a" text-anchor="end" font-weight="normal">готово: 2860</text><rect x="20" y="380" width="410" height="66" rx="6" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5"/><text x="225" y="402" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пропуск (тап или клавиша) в любой момент</text><text x="225" y="417" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">оверлей снят, шторка открыта сразу в состоянии</text><text x="225" y="432" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">«после посадки»: шар №1 на карточке, без полёта</text><rect x="450" y="380" width="430" height="66" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="665" y="402" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Что остаётся неизменным</text><text x="665" y="417" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">очередь считается до интро; без пропуска ввод не</text><text x="665" y="432" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">нужен; шаров не больше 15, лоток по ширине экрана</text></svg>