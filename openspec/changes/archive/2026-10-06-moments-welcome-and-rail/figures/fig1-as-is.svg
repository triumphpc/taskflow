<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="28" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Как есть: вход в Moments и смена карточки</text><rect x="10" y="60" width="160" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="90" y="88.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">m или кнопка ◎</text><text x="90" y="103.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">app.js</text><rect x="190" y="60" width="160" height="64" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openMoments()</text><text x="270" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">очередь один раз</text><text x="270" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">busy: только интро</text><rect x="370" y="60" width="160" height="64" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="450" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">playIntro(queue)</text><text x="450" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">шары с краёв, 1,5 с</text><text x="450" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">приветствия нет</text><rect x="550" y="60" width="160" height="64" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="630" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">оверлей снят</text><text x="630" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">шаров больше нет</text><text x="630" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">лотка нет</text><rect x="730" y="60" width="160" height="64" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="810" y="81" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openSheet + openQueue</text><text x="810" y="96" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">заголовок без даты</text><text x="810" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">и числа задач</text><polyline points="170,92 190,92" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><polyline points="350,92 370,92" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><polyline points="530,92 550,92" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><polyline points="710,92 730,92" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="180" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">keydown</text><text x="360" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">queue</text><text x="540" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">done | skipped</text><text x="720" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">.finally()</text><polyline points="810,124 810,170 120,170 120,200" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="460" y="164" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">шторка открыта</text><rect x="10" y="200" width="220" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="120" y="229" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">5 путей ответа</text><text x="120" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">пикер, ✓, ✕, ↷,</text><text x="120" y="259" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">«Пропустить»</text><rect x="280" y="200" width="250" height="80" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="405" y="229" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">next(): index++; step()</text><text x="405" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">clear(body)</text><text x="405" y="259" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">новая карточка на то же место</text><rect x="580" y="200" width="310" height="80" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="735" y="229" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">карточка k+1 вместо карточки k</text><text x="735" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">подмена за один кадр</text><text x="735" y="259" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">смену легко не заметить</text><polyline points="230,240 280,240" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="255" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">M.* сразу</text><polyline points="530,240 580,240" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="555" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">render</text><rect x="10" y="320" width="430" height="76" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="225" y="347" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Повторный запуск</text><text x="225" y="362" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">m при уже открытой шторке: busy уже false,</text><text x="225" y="377" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">открывается вторая шторка поверх первой</text><rect x="460" y="320" width="430" height="76" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="675" y="347" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Шары не связаны с работой</text><text x="675" y="362" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">после интро шаров нет, лотка нет; смена карточки</text><text x="675" y="377" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">синхронная, поэтому защиты от двойного нажатия нет</text><rect x="10" y="440" width="14" height="14" rx="0" fill="#fbe9e7" stroke="#dc2626" stroke-width="1"/><text x="32" y="452" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">красный: то, что меняется</text></svg>