<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="10" width="420" height="250" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="34" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Было: «✓ Уже сделано»</text><text x="220" y="52" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">смена карточки мгновенная</text><rect x="100" y="70" width="240" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="220" y="92" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">касание «✓ Уже сделано»</text><polyline points="220,106 220,126" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="100" y="126" width="240" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="220" y="148" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M.toggleDone(id)</text><polyline points="220,162 220,182" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="100" y="182" width="240" height="36" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="220" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">next(): clear(body); step()</text><text x="220" y="242" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">карточка k+1 на месте карточки k, 0 мс</text><rect x="470" y="10" width="420" height="250" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="680" y="34" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Стало: «✓ Уже сделано»</text><text x="680" y="52" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">данные сразу, показ за 350 мс</text><rect x="560" y="70" width="240" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="680" y="92" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">касание «✓ Уже сделано»</text><polyline points="680,106 680,126" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="560" y="126" width="240" height="36" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="680" y="148" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">gate.lock → M.toggleDone(id)</text><polyline points="680,162 680,182" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="560" y="182" width="240" height="36" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="680" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ghost + step() + 4 анимации</text><text x="680" y="242" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">задача записана в t=0, смена видна</text><text x="450" y="292" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Стало: что происходит внутри 350 мс</text><text x="320" y="330" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">ghost: карточка уезжает вправо</text><rect x="330" y="316" width="300" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="320" y="362" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">ghost: её шар катится и гаснет</text><rect x="450" y="348" width="180" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="320" y="394" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">шар лотка катится на карточку</text><rect x="510" y="380" width="345" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="320" y="426" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">лоток сдвигается влево</text><rect x="510" y="412" width="345" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="320" y="458" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">новая карточка въезжает снизу</text><rect x="555" y="444" width="300" height="20" rx="3" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><line x1="330" y1="482" x2="855" y2="482" stroke="#9ca3af" stroke-width="1.5"/><line x1="330" y1="482" x2="330" y2="487" stroke="#9ca3af" stroke-width="1.5"/><text x="330" y="500" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">0 мс</text><line x1="480" y1="482" x2="480" y2="487" stroke="#9ca3af" stroke-width="1.5"/><text x="480" y="500" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">100 мс</text><line x1="630" y1="482" x2="630" y2="487" stroke="#9ca3af" stroke-width="1.5"/><text x="630" y="500" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">200 мс</text><line x1="780" y1="482" x2="780" y2="487" stroke="#9ca3af" stroke-width="1.5"/><text x="780" y="500" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">300 мс</text><line x1="855" y1="482" x2="855" y2="487" stroke="#9ca3af" stroke-width="1.5"/><text x="855" y="500" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">350 мс</text><line x1="480" y1="308" x2="480" y2="482" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/><text x="484" y="304" font-size="11" fill="#d97706" text-anchor="start" font-weight="normal">второе касание в t=100: gate занят, ничего не происходит</text><line x1="855" y1="308" x2="855" y2="482" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="855" y="518" font-size="11" fill="#16a34a" text-anchor="end" font-weight="normal">посадка: gate.unlock, ghost снят</text></svg>