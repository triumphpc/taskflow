<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="18" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="80" y1="54" x2="80" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="188" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="250" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">app.js</text><line x1="250" y1="54" x2="250" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="358" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="420" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments.js</text><line x1="420" y1="54" x2="420" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="538" y="20" width="124" height="34" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="600" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments-intro.js</text><line x1="600" y1="54" x2="600" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="728" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="790" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">шторка (openSheet)</text><line x1="790" y1="54" x2="790" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="80" y1="110" x2="250" y2="110" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="165.0" y="104" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">m или кнопка</text><line x1="250" y1="150" x2="420" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="335.0" y="144" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">openMoments()</text><polyline points="420,178 454,178 454,194 422,194" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="462" y="190" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">queue = momentsCandidates(), один раз</text><line x1="420" y1="236" x2="600" y2="236" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="510.0" y="230" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">playIntro(queue)</text><text x="380" y="226" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">нет reduced-motion, очередь ≠ ∅</text><polyline points="600,262 634,262 634,278 602,278" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="642" y="274" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">оверлей, ≤ 15 шаров катятся в пирамиду</text><line x1="80" y1="330" x2="600" y2="330" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-orange)"/><text x="340.0" y="324" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">тап или клавиша (необязательно)</text><line x1="600" y1="376" x2="420" y2="376" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-green)"/><text x="510.0" y="370" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">resolve: «по таймеру ≈1,5 с» или «пропуск»</text><line x1="420" y1="418" x2="790" y2="418" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="605.0" y="412" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">openSheet(queue)</text><line x1="790" y1="458" x2="80" y2="458" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-gray)"/><text x="435.0" y="452" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">первая карточка очереди</text><rect x="60" y="484" width="780" height="40" rx="4" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="70" y="503" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">reduced-motion или пустая очередь: playIntro не вызывается, openSheet стоит сразу после очереди.</text></svg>