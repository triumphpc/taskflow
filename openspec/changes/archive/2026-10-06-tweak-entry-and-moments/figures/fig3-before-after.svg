<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="410" height="60" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="225" y="45" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Было: «Завтра» в окне разбора входящего</text><text x="225" y="64" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">два ответа на один вопрос «когда»</text><rect x="470" y="20" width="410" height="60" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="675" y="45" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Стало: «Завтра» в окне разбора входящего</text><text x="675" y="64" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">один ответ; время нужно только для «Сегодня»</text><rect x="100" y="110" width="250" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="225.0" y="128.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">касание «Завтра»</text><text x="225.0" y="143.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">setDate(завтра)</text><polyline points="225,154 225,184" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="100" y="184" width="250" height="44" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="225.0" y="202.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">раскрывается «Во сколько»</text><text x="225.0" y="217.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">date &amp;&amp; dateAnswered</text><polyline points="225,228 225,258" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><text x="300" y="248" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">второе касание</text><rect x="100" y="258" width="250" height="44" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="225.0" y="276.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">«Без времени» (или часть дня)</text><text x="225.0" y="291.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">onDone()</text><polyline points="225,302 225,332" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="100" y="332" width="250" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="225.0" y="350.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">inboxToTask(дата) и закрытие окна</text><text x="225.0" y="365.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">срок «завтра» без времени</text><text x="225" y="410" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">2 касания после выбора дня</text><rect x="550" y="110" width="250" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="675.0" y="128.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">касание «Завтра»</text><text x="675.0" y="143.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">setDate(завтра)</text><polyline points="675,154 675,184" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="550" y="184" width="250" height="44" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="675.0" y="202.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">needsTimeStep(дата) = false</text><text x="675.0" y="217.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">время сбрасывается, onDone() сразу</text><polyline points="675,228 675,258" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="550" y="258" width="250" height="44" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="675.0" y="276.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">inboxToTask(дата) и закрытие окна</text><text x="675.0" y="291.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">срок «завтра» без времени</text><text x="675" y="332" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">1 касание после выбора дня</text><rect x="520" y="350" width="330" height="100" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="535" y="372" font-size="11" fill="#1f2937" text-anchor="start" font-weight="bold">Не меняется</text><text x="535" y="392" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">«Сегодня»: шаг «Во сколько» раскрывается как раньше.</text><text x="535" y="410" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">«Без даты»: готово сразу, как раньше.</text><text x="535" y="428" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Время из текста («завтра 18:30») сохраняется.</text></svg>