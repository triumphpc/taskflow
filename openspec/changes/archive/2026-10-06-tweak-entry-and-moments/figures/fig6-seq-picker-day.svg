<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="18" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="80" y1="54" x2="80" y2="480" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="198" y="20" width="124" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="260" y="37" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">schedulePicker</text><text x="260" y="53" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">scheduler.js</text><line x1="260" y1="60" x2="260" y2="480" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="408" y="20" width="124" height="40" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="470" y="37" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">core.js</text><text x="470" y="53" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">чистые функции</text><line x1="470" y1="60" x2="470" y2="480" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="668" y="20" width="124" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="730" y="37" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">хост</text><text x="730" y="53" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">onChange / onDone</text><line x1="730" y1="60" x2="730" y2="480" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="80" y1="112" x2="260" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="170.0" y="106" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">касание «Завтра» / ячейка календаря</text><line x1="260" y1="154" x2="470" y2="154" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="365.0" y="148" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">timeAfterDayPick(next, time) → null</text><line x1="260" y1="192" x2="470" y2="192" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="365.0" y="186" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">needsTimeStep(next) → false</text><polyline points="260,212 294,212 294,228 262,228" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="302" y="224" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">render(): шага «Во сколько» нет</text><line x1="260" y1="270" x2="730" y2="270" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="495.0" y="264" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">onChange({priority, due: дата без времени, dateAnswered})</text><line x1="260" y1="312" x2="730" y2="312" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="495.0" y="306" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">onDone()   (done = !needsTimeStep)</text><text x="740" y="338" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">композер: onDone нет, «Добавить» готова</text><text x="740" y="352" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">карточка: строка «Когда» сворачивается</text><text x="740" y="366" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">разбор и Moments: окно закрыто / следующая карточка</text><rect x="40" y="392" width="820" height="84" rx="4" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50" y="411" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">«Сегодня» (date === todayStr()): needsTimeStep → true, time сохраняется, render() рисует «Во сколько»,</text><text x="50" y="426" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">onDone придёт только после выбора части дня или «Без времени».</text><text x="50" y="441" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">«Без даты»: needsTimeStep(null) → false, time = null, onDone сразу, как раньше.</text><text x="50" y="456" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">set() (быстрый ввод «завтра 18:30») время не сбрасывает: сброс только в setDate().</text></svg>