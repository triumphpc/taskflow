<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="24" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Выбор срока: schedulePicker, один компонент в четырёх местах</text><rect x="20" y="40" width="170" height="120" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="34" y="62" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Где живёт</text><text x="34" y="77" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">окно «Новая задача»</text><text x="34" y="92" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">карточка задачи</text><text x="34" y="107" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">разбор входящего</text><text x="34" y="122" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Moments</text><polyline points="190,100 230,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="230" y="75" width="110" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="285.0" y="104.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Приоритет</text><polyline points="340,100 380,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="380" y="75" width="190" height="50" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="475.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">День</text><text x="475.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">setDate() + needsTimeStep()</text><polyline points="570,100 670,100" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="620" y="92" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">date = сегодня</text><rect x="670" y="75" width="150" height="50" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="745.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Во сколько</text><text x="745.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">только для «Сегодня»</text><polyline points="820,100 870,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="845" y="92" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">время</text><rect x="870" y="75" width="110" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="925.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">готово</text><text x="925.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">onDone()</text><polyline points="475,125 475,172 925,172 925,125" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="700" y="188" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">любой другой день и «Без даты»: готово сразу, срок без времени</text><text x="20" y="225" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Окно «Новая задача»: добавление</text><rect x="20" y="245" width="150" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="95.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">«Добавить» / Enter</text><text x="95.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">submit()</text><polyline points="170,270 220,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="220" y="245" width="140" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M.createTask</text><text x="290.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">задача в списке</text><polyline points="360,270 410,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="410" y="245" width="270" height="50" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="545.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ui.close()</text><text x="545.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">окно закрыто, пустой формы нет</text><polyline points="680,270 730,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="730" y="245" width="240" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="850.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">тост «Задача добавлена»</text><text x="850.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">«Открыть» открывает задачу</text><text x="20" y="335" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Вход в Moments</text><rect x="20" y="355" width="170" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="105.0" y="376.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">m / две кнопки</text><text x="105.0" y="391.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">app.js</text><polyline points="190,380 230,380" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="230" y="355" width="250" height="50" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="355.0" y="376.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openMoments()</text><text x="355.0" y="391.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">очередь один раз + защита от повтора</text><polyline points="480,380 560,380" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="520" y="372" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">очередь ≠ ∅</text><rect x="560" y="355" width="230" height="50" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="675.0" y="376.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments-intro.js</text><text x="675.0" y="391.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">оверлей: шары в пирамиду, ≈1,5 с</text><polyline points="790,380 860,380" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="825" y="372" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">по таймеру</text><rect x="860" y="355" width="120" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="920.0" y="376.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openSheet()</text><text x="920.0" y="391.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">первая карточка</text><rect x="560" y="430" width="230" height="44" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="675.0" y="448.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">pyramid.js</text><text x="675.0" y="463.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">раскладка, цвет, номер</text><polyline points="675,430 675,405" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><polyline points="355,405 355,495 920,495 920,405" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/><text x="640" y="489" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">reduced-motion, пустая очередь, тап или клавиша: без оверлея</text><text x="20" y="514" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Зелёное: новое или изменённое. Оранжевое: путь без анимации. sw.js: taskflow-v17, оба новых модуля в SHELL.</text></svg>