<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="18" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments.js</text><line x1="80" y1="54" x2="80" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="208" y="20" width="124" height="34" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">moments-intro.js</text><line x1="270" y1="54" x2="270" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="408" y="20" width="124" height="40" rx="6" fill="#e3f2e7" stroke="#16a34a" stroke-width="1.5"/><text x="470" y="37" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">pyramid.js</text><text x="470" y="53" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">чистый модуль</text><line x1="470" y1="60" x2="470" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="608" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="670" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">DOM + WAAPI</text><line x1="670" y1="54" x2="670" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="808" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="870" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">document</text><line x1="870" y1="54" x2="870" y2="520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="80" y1="112" x2="270" y2="112" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="175.0" y="106" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">playIntro(queue)</text><line x1="270" y1="150" x2="470" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="370.0" y="144" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">buildIntro(queue, W, H)</text><line x1="470" y1="184" x2="270" y2="184" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-green)"/><text x="370.0" y="178" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">{ balls[≤15]: слот, старт, цвет, номер, delay, duration; total }</text><line x1="270" y1="226" x2="670" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="470.0" y="220" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">оверлей + .ball × n; el.animate(keyframes)</text><line x1="270" y1="262" x2="870" y2="262" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="570.0" y="256" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">click по оверлею, keydown на document (capture, !repeat)</text><polyline points="270,284 304,284 304,300 272,300" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="312" y="296" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">setTimeout(finish, total ≈ 1500 мс)</text><line x1="870" y1="346" x2="270" y2="346" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-orange)"/><text x="570.0" y="340" font-size="11" fill="#d97706" text-anchor="middle" font-weight="normal">тап или клавиша: finish(«skipped»)</text><line x1="270" y1="384" x2="670" y2="384" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="470.0" y="378" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">animation.cancel(); overlay.remove()</text><line x1="270" y1="420" x2="870" y2="420" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="570.0" y="414" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">снять слушатели</text><line x1="270" y1="456" x2="80" y2="456" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-green)"/><text x="175.0" y="450" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">resolve(«done» | «skipped»)</text><rect x="40" y="482" width="880" height="40" rx="4" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50" y="501" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">finish() идемпотентна: срабатывает первый из таймера и пропуска, второй вызов ничего не делает.</text></svg>