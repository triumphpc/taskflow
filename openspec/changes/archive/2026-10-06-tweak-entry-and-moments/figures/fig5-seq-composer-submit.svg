<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="18" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Пользователь</text><line x1="80" y1="54" x2="80" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="198" y="20" width="124" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="260" y="37" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openComposer</text><text x="260" y="53" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">ui.js</text><line x1="260" y1="60" x2="260" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="388" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="450" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">schedulePicker</text><line x1="450" y1="54" x2="450" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="558" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="620" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">model.js</text><line x1="620" y1="54" x2="620" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><rect x="748" y="20" width="124" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="810" y="41" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">окно + тост</text><line x1="810" y1="54" x2="810" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="80" y1="110" x2="260" y2="110" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="170.0" y="104" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">Enter или «Добавить»</text><line x1="260" y1="150" x2="450" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="355.0" y="144" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">pendingStep()</text><line x1="450" y1="184" x2="260" y2="184" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-gray)"/><text x="355.0" y="178" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">null: оба шага отвечены</text><polyline points="260,206 294,206 294,222 262,222" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="302" y="218" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">parseQuickInput(raw) → title</text><line x1="260" y1="262" x2="620" y2="262" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="440.0" y="256" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">createTask({title, due, priority})</text><line x1="620" y1="298" x2="260" y2="298" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-gray)"/><text x="440.0" y="292" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">task</text><line x1="260" y1="338" x2="810" y2="338" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/><text x="535.0" y="332" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">ui.close()</text><line x1="260" y1="374" x2="810" y2="374" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="535.0" y="368" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">toast(«Задача добавлена», «Открыть»)</text><rect x="40" y="396" width="820" height="34" rx="4" fill="#fdf0dd" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50" y="415" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">pendingStep() ≠ null: picker.nudge(step), return. Окно остаётся открытым, задача не создаётся (AC-002).</text></svg>