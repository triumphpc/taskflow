<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="24" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Выбор срока: schedulePicker, один компонент в четырёх местах</text><rect x="20" y="40" width="170" height="120" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="34" y="62" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Где живёт</text><text x="34" y="77" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">окно «Новая задача»</text><text x="34" y="92" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">карточка задачи</text><text x="34" y="107" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">разбор входящего</text><text x="34" y="122" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Moments</text><polyline points="190,100 230,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="230" y="75" width="110" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="285.0" y="104.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Приоритет</text><polyline points="340,100 400,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="400" y="75" width="120" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="460.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">День</text><text x="460.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">setDate()</text><polyline points="520,100 610,100" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><text x="565" y="92" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal">любой день</text><rect x="610" y="75" width="140" height="50" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="680.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Во сколько</text><text x="680.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">для любого дня</text><polyline points="750,100 820,100" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="785" y="92" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">время</text><rect x="820" y="75" width="150" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="895.0" y="96.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">готово</text><text x="895.0" y="111.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">onDone()</text><text x="610" y="145" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">лишний вопрос для «Завтра», «Через 2 дня», числа</text><polyline points="460,125 460,172 895,172 895,125" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="680" y="188" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">«Без даты»: шаг времени пропускается</text><text x="20" y="225" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Окно «Новая задача»: добавление</text><rect x="20" y="245" width="150" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="95.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">«Добавить» / Enter</text><text x="95.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">submit()</text><polyline points="170,270 220,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="220" y="245" width="140" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M.createTask</text><text x="290.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">задача в списке</text><polyline points="360,270 410,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="410" y="245" width="270" height="50" rx="6" fill="#fbe9e7" stroke="#dc2626" stroke-width="1.5"/><text x="545.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">очистить поле, сбросить шаги</text><text x="545.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">input.focus(): окно остаётся открытым</text><polyline points="680,270 730,270" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="730" y="245" width="240" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="850.0" y="266.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">тост «Задача добавлена»</text><text x="850.0" y="281.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">действие «Открыть»</text><text x="410" y="318" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">читается как «открылась новая форма» (SRC-1)</text><text x="20" y="365" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Вход в Moments</text><rect x="20" y="385" width="170" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="105.0" y="406.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">m / две кнопки</text><text x="105.0" y="421.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">app.js</text><polyline points="190,410 235,410" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="235" y="385" width="220" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="345.0" y="406.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openMoments()</text><text x="345.0" y="421.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">очередь = momentsCandidates()</text><polyline points="455,410 500,410" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="500" y="385" width="180" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="590.0" y="406.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">openSheet()</text><text x="590.0" y="421.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">сразу, без паузы</text><polyline points="680,410 725,410" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a-gray)"/><rect x="725" y="385" width="245" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="847.5" y="406.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">шторка с первой карточкой</text><text x="847.5" y="421.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">вход ничем не отмечен</text><text x="20" y="458" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Красным отмечено то, что пользователь хочет изменить. Серое показано для ориентира.</text></svg>